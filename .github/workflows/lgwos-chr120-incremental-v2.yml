name: LGWOS Chromium120 Incremental V2

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/lgwos-chr120-incremental-v2.yml

permissions:
  contents: read

concurrency:
  group: lgwos-chr120-incremental-v2
  cancel-in-progress: true

env:
  LGWOS_TARGET_SHA: e6a73fffdbe3bcc6f7fc33316c74adc6e7c01853
  WEBOS_SDK_URL: https://github.com/openlgtv/buildroot-nc4/releases/download/webos-a38c582/arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz
  WEBOS_SDK_SHA256: 04ad3311b48b4557a7002aef56ae2e167478e8e129f37daac04649bddf813616
  BUILDROOT_REF: a38c582ea397fec612811f8e933ae982d41fc5a3
  OUT_DIR: out/LGWOS-Probe
  NSS_CHECKPOINT_SCHEMA: nss-v1
  SYSDEPS_CHECKPOINT_SCHEMA: sysdeps-v1
  CHROMIUM_CHECKPOINT_SCHEMA: chromium-out-v1

jobs:
  incremental:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Runner cleanup
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          sudo apt-get clean || true
          df -h /

      - name: Checkout exact Chromium 120 source
        uses: actions/checkout@v4
        with:
          ref: e6a73fffdbe3bcc6f7fc33316c74adc6e7c01853
          fetch-depth: 1
          submodules: false
          lfs: false
          clean: true

      - name: Install incremental prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            binutils \
            bzip2 \
            ca-certificates \
            cpio \
            curl \
            file \
            gcc \
            g++ \
            gzip \
            make \
            ninja-build \
            patch \
            perl \
            pkg-config \
            python3 \
            python3-six \
            rsync \
            tar \
            unzip \
            wget \
            xz-utils

      - name: Download and relocate webOS SDK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/lgwos-logs"
          SDK_ARCHIVE="$RUNNER_TEMP/webos-sdk.tar.gz"

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 20 \
            -o "$SDK_ARCHIVE" \
            "$WEBOS_SDK_URL"

          echo "$WEBOS_SDK_SHA256  $SDK_ARCHIVE" | sha256sum -c -

          sudo rm -rf /opt/lgwos-sdk
          sudo mkdir -p /opt/lgwos-sdk
          sudo tar -xzf "$SDK_ARCHIVE" -C /opt/lgwos-sdk
          rm -f "$SDK_ARCHIVE"
          sudo chown -R "$USER:$USER" /opt/lgwos-sdk

          SDK_ENV="$(find /opt/lgwos-sdk -type f -name environment-setup -print -quit)"
          test -n "$SDK_ENV"
          SDK_DIR="$(dirname "$SDK_ENV")"

          if [ -x "$SDK_DIR/relocate-sdk.sh" ]; then
            "$SDK_DIR/relocate-sdk.sh"
          fi

          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"
          echo "SDK_ENV=$SDK_ENV" >> "$GITHUB_ENV"

          . "$SDK_ENV"
          TARGET_SYSROOT="$(${CC%% *} --print-sysroot)"
          echo "TARGET_SYSROOT=$TARGET_SYSROOT" >> "$GITHUB_ENV"

          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "SDK_DIR=$SDK_DIR"
            echo "SDK_ENV=$SDK_ENV"
            echo "TARGET_SYSROOT=$TARGET_SYSROOT"
            ${CC%% *} --version
            df -h /
          } | tee "$GITHUB_WORKSPACE/lgwos-logs/incremental-bootstrap.log"

          test "$(git rev-parse HEAD)" = "$LGWOS_TARGET_SHA"

      - name: Restore validated system-dependency checkpoint
        id: sysdeps_checkpoint
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/buildroot-nss-out
          key: lgwos-${{ env.SYSDEPS_CHECKPOINT_SCHEMA }}-${{ env.WEBOS_SDK_SHA256 }}-${{ env.BUILDROOT_REF }}
          restore-keys: |
            lgwos-${{ env.NSS_CHECKPOINT_SCHEMA }}-${{ env.WEBOS_SDK_SHA256 }}-${{ env.BUILDROOT_REF }}
          fail-on-cache-miss: false

      - name: Validate inherited NSS checkpoint
        id: nss_validate
        shell: bash
        run: |
          set -uo pipefail
          . "$SDK_ENV"

          LOG="$GITHUB_WORKSPACE/lgwos-logs/sysdeps-checkpoint.log"
          BUILDROOT_OUT="$RUNNER_TEMP/buildroot-nss-out"
          BUILDROOT_TARGET_CC="$BUILDROOT_OUT/host/bin/arm-webos-linux-gnueabi-gcc"

          echo "SYSDEPS_CHECKPOINT_HIT=${{ steps.sysdeps_checkpoint.outputs.cache-hit }}" | tee "$LOG"
          echo "SYSDEPS_CHECKPOINT_MATCHED=${{ steps.sysdeps_checkpoint.outputs.cache-matched-key }}" | tee -a "$LOG"

          if [ -z "${{ steps.sysdeps_checkpoint.outputs.cache-matched-key }}" ]; then
            echo 'SYSDEPS_CHECKPOINT_ERROR=MISS' | tee -a "$LOG"
            echo 'nss_validate_rc=90' >> "$GITHUB_OUTPUT"
            echo 'NSS_VALIDATE_RC=90' >> "$GITHUB_ENV"
            exit 0
          fi

          if [ ! -x "$BUILDROOT_TARGET_CC" ]; then
            echo "SYSDEPS_CHECKPOINT_ERROR=TARGET_CC_MISSING:$BUILDROOT_TARGET_CC" | tee -a "$LOG"
            echo 'nss_validate_rc=91' >> "$GITHUB_OUTPUT"
            echo 'NSS_VALIDATE_RC=91' >> "$GITHUB_ENV"
            exit 0
          fi

          STAGING_DIR="$($BUILDROOT_TARGET_CC --print-sysroot 2>/dev/null || true)"
          echo "NSS_BUILD_STAGING=$STAGING_DIR" | tee -a "$LOG"
          echo "BUILDROOT_STAGING=$STAGING_DIR" >> "$GITHUB_ENV"

          VERIFY_RC=0
          for F in \
            "$STAGING_DIR/usr/lib/pkgconfig/nspr.pc" \
            "$STAGING_DIR/usr/lib/pkgconfig/nss.pc" \
            "$STAGING_DIR/usr/lib/libnspr4.so" \
            "$STAGING_DIR/usr/lib/libnss3.so" \
            "$STAGING_DIR/usr/lib/libssl3.so"
          do
            if [ -e "$F" ]; then
              echo "NSS_CHECKPOINT_OK=$F" | tee -a "$LOG"
            else
              echo "NSS_CHECKPOINT_MISSING=$F" | tee -a "$LOG"
              VERIFY_RC=1
            fi
          done

          echo "NSS_VALIDATE_RC=$VERIFY_RC" | tee -a "$LOG"
          echo "NSS_VALIDATE_RC=$VERIFY_RC" >> "$GITHUB_ENV"
          echo "nss_validate_rc=$VERIFY_RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build ABI-compatible libdrm into inherited Buildroot checkpoint
        id: libdrm_build
        if: ${{ steps.nss_validate.conclusion == 'success' && steps.nss_validate.outputs.nss_validate_rc == '0' }}
        shell: bash
        run: |
          set -uo pipefail
          . "$SDK_ENV"

          LOG="$GITHUB_WORKSPACE/lgwos-logs/libdrm-build.log"
          BUILDROOT_SRC="$RUNNER_TEMP/buildroot-nc4"
          BUILDROOT_OUT="$RUNNER_TEMP/buildroot-nss-out"
          BUILDROOT_TARBALL="$RUNNER_TEMP/buildroot-nc4.tar.gz"
          BUILDROOT_TARGET_CC="$BUILDROOT_OUT/host/bin/arm-webos-linux-gnueabi-gcc"
          STAGING_DIR="$($BUILDROOT_TARGET_CC --print-sysroot 2>/dev/null || true)"

          echo "SYSDEPS_CHECKPOINT_MATCHED=${{ steps.sysdeps_checkpoint.outputs.cache-matched-key }}" | tee "$LOG"
          echo "STAGING_DIR=$STAGING_DIR" | tee -a "$LOG"

          if [ -f "$STAGING_DIR/usr/lib/pkgconfig/libdrm.pc" ] && \
             ls "$STAGING_DIR/usr/lib"/libdrm.so* >/dev/null 2>&1; then
            echo 'LIBDRM_CHECKPOINT_PRESENT=YES' | tee -a "$LOG"
            echo 'libdrm_build_rc=0' >> "$GITHUB_OUTPUT"
            echo 'LIBDRM_BUILD_RC=0' >> "$GITHUB_ENV"
            exit 0
          fi

          echo 'LIBDRM_CHECKPOINT_PRESENT=NO' | tee -a "$LOG"
          rm -rf "$BUILDROOT_SRC" "$BUILDROOT_TARBALL"
          mkdir -p "$BUILDROOT_SRC"

          set +e
          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 20 \
            -o "$BUILDROOT_TARBALL" \
            "https://codeload.github.com/openlgtv/buildroot-nc4/tar.gz/$BUILDROOT_REF" \
            2>&1 | tee -a "$LOG"
          FETCH_RC=${PIPESTATUS[0]}
          set -e

          if [ "$FETCH_RC" -ne 0 ]; then
            echo "BUILDROOT_FETCH_RC=$FETCH_RC" | tee -a "$LOG"
            echo "libdrm_build_rc=$FETCH_RC" >> "$GITHUB_OUTPUT"
            echo "LIBDRM_BUILD_RC=$FETCH_RC" >> "$GITHUB_ENV"
            exit 0
          fi

          tar -xzf "$BUILDROOT_TARBALL" --strip-components=1 -C "$BUILDROOT_SRC"
          rm -f "$BUILDROOT_TARBALL"

          echo '=== RESTORE UPSTREAM BUILDROOT KERNEL-HEADER VALIDATION ===' | tee -a "$LOG"
          python3 - "$BUILDROOT_SRC/toolchain/helpers.mk" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          lines = path.read_text().splitlines(True)
          out = []
          restoring = False
          restored = False

          for line in lines:
              if line.startswith("#check_kernel_headers_version ="):
                  restoring = True
                  restored = True
              if restoring and line.startswith("#"):
                  line = line[1:]
              out.append(line)
              if restoring and line.lstrip().startswith("fi"):
                  restoring = False

          if not restored:
              raise SystemExit("expected commented check_kernel_headers_version block not found")

          path.write_text("".join(out))
          PY

          echo '=== BUILD LIBDRM 2.4.124 INTO EXISTING BUILDROOT OUTPUT ===' | tee -a "$LOG"
          set +e
          make -C "$BUILDROOT_SRC" O="$BUILDROOT_OUT" -j4 libdrm \
            2>&1 | tee -a "$LOG"
          BUILD_RC=${PIPESTATUS[0]}
          set -e

          echo "BUILDROOT_LIBDRM_RC=$BUILD_RC" | tee -a "$LOG"
          if [ "$BUILD_RC" -ne 0 ]; then
            echo "libdrm_build_rc=$BUILD_RC" >> "$GITHUB_OUTPUT"
            echo "LIBDRM_BUILD_RC=$BUILD_RC" >> "$GITHUB_ENV"
            exit 0
          fi

          VERIFY_RC=0
          for F in \
            "$STAGING_DIR/usr/lib/pkgconfig/libdrm.pc" \
            "$STAGING_DIR/usr/include/xf86drm.h" \
            "$STAGING_DIR/usr/include/xf86drmMode.h" \
            "$STAGING_DIR/usr/include/libdrm/drm.h"
          do
            if [ -e "$F" ]; then
              echo "LIBDRM_BUILT_OK=$F" | tee -a "$LOG"
            else
              echo "LIBDRM_BUILT_MISSING=$F" | tee -a "$LOG"
              VERIFY_RC=1
            fi
          done

          if ! ls "$STAGING_DIR/usr/lib"/libdrm.so* >/dev/null 2>&1; then
            echo 'LIBDRM_BUILT_MISSING=libdrm.so*' | tee -a "$LOG"
            VERIFY_RC=1
          fi

          echo '=== LIBDRM ABI AUDIT ===' | tee -a "$LOG"
          for F in "$STAGING_DIR/usr/lib"/libdrm.so*; do
            if [ -e "$F" ] && [ ! -L "$F" ]; then
              echo "--- $(basename "$F") ---" | tee -a "$LOG"
              ${READELF%% *} -A "$F" 2>/dev/null | tee -a "$LOG" || true
              ${READELF%% *} --version-info "$F" 2>/dev/null | \
                grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tee -a "$LOG" || true
            fi
          done

          echo "LIBDRM_BUILD_RC=$VERIFY_RC" | tee -a "$LOG"
          echo "LIBDRM_BUILD_RC=$VERIFY_RC" >> "$GITHUB_ENV"
          echo "libdrm_build_rc=$VERIFY_RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Inject and validate system dependencies in fresh SDK
        id: sysdeps_inject
        if: ${{ steps.libdrm_build.conclusion == 'success' && steps.libdrm_build.outputs.libdrm_build_rc == '0' }}
        shell: bash
        run: |
          set -uo pipefail
          . "$SDK_ENV"

          LOG="$GITHUB_WORKSPACE/lgwos-logs/sysdeps-inject.log"
          BUILDROOT_OUT="$RUNNER_TEMP/buildroot-nss-out"
          BUILDROOT_TARGET_CC="$BUILDROOT_OUT/host/bin/arm-webos-linux-gnueabi-gcc"
          STAGING_DIR="$($BUILDROOT_TARGET_CC --print-sysroot 2>/dev/null || true)"
          TARGET_SYSROOT="$(${CC%% *} --print-sysroot)"
          VERIFY_RC=0

          install -d \
            "$TARGET_SYSROOT/usr/include/nspr" \
            "$TARGET_SYSROOT/usr/include/nss" \
            "$TARGET_SYSROOT/usr/include/libdrm" \
            "$TARGET_SYSROOT/usr/lib/pkgconfig"

          rsync -a "$STAGING_DIR/usr/include/nspr/" "$TARGET_SYSROOT/usr/include/nspr/"
          rsync -a "$STAGING_DIR/usr/include/nss/" "$TARGET_SYSROOT/usr/include/nss/"
          rsync -a "$STAGING_DIR/usr/include/libdrm/" "$TARGET_SYSROOT/usr/include/libdrm/"
          cp -a "$STAGING_DIR/usr/include/xf86drm.h" "$TARGET_SYSROOT/usr/include/"
          cp -a "$STAGING_DIR/usr/include/xf86drmMode.h" "$TARGET_SYSROOT/usr/include/"

          for PC in nspr.pc nss.pc libdrm.pc; do
            cp -a "$STAGING_DIR/usr/lib/pkgconfig/$PC" "$TARGET_SYSROOT/usr/lib/pkgconfig/"
          done

          for GLOB in \
            'libnspr4.so*' \
            'libplc4.so*' \
            'libplds4.so*' \
            'libnss*.so*' \
            'libsmime3.so*' \
            'libssl3.so*' \
            'libsoftokn3.so*' \
            'libfreebl*.so*' \
            'libdrm.so*'
          do
            for F in "$STAGING_DIR/usr/lib"/$GLOB; do
              if [ -e "$F" ]; then
                cp -a "$F" "$TARGET_SYSROOT/usr/lib/"
              fi
            done
          done

          export PKG_CONFIG_SYSROOT_DIR="$TARGET_SYSROOT"
          export PKG_CONFIG_LIBDIR="$TARGET_SYSROOT/usr/lib/pkgconfig:$TARGET_SYSROOT/usr/share/pkgconfig"

          NSS_VERSION="$(/usr/bin/pkg-config --modversion nss 2>/dev/null || true)"
          NSPR_VERSION="$(/usr/bin/pkg-config --modversion nspr 2>/dev/null || true)"
          LIBDRM_VERSION="$(/usr/bin/pkg-config --modversion libdrm 2>/dev/null || true)"

          echo "NSS_VERSION=$NSS_VERSION" | tee "$LOG"
          echo "NSPR_VERSION=$NSPR_VERSION" | tee -a "$LOG"
          echo "LIBDRM_VERSION=$LIBDRM_VERSION" | tee -a "$LOG"
          echo "LIBDRM_CFLAGS=$(/usr/bin/pkg-config --cflags libdrm 2>/dev/null || true)" | tee -a "$LOG"
          echo "LIBDRM_LIBS=$(/usr/bin/pkg-config --libs libdrm 2>/dev/null || true)" | tee -a "$LOG"

          cat > "$RUNNER_TEMP/lgwos-sysdeps-probe.c" <<'EOF'
          #include <nss.h>
          #include <xf86drm.h>
          int main(void) {
            drmVersionPtr version = drmGetVersion(-1);
            if (version) drmFreeVersion(version);
            return NSS_VersionCheck("3.0") ? 0 : 1;
          }
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/lgwos-sysdeps-probe.c"

          SYSDEPS_CFLAGS="$(/usr/bin/pkg-config --cflags nss libdrm 2>/dev/null || true)"
          SYSDEPS_LIBS="$(/usr/bin/pkg-config --libs nss libdrm 2>/dev/null || true)"

          set +e
          ${CC%% *} $SYSDEPS_CFLAGS "$RUNNER_TEMP/lgwos-sysdeps-probe.c" $SYSDEPS_LIBS \
            -o "$RUNNER_TEMP/lgwos-sysdeps-probe" \
            2>&1 | tee -a "$LOG"
          LINK_RC=${PIPESTATUS[0]}
          set -e

          echo "SYSDEPS_LINK_PROBE_RC=$LINK_RC" | tee -a "$LOG"
          file "$RUNNER_TEMP/lgwos-sysdeps-probe" 2>/dev/null | tee -a "$LOG" || true
          ${READELF%% *} -d "$RUNNER_TEMP/lgwos-sysdeps-probe" 2>/dev/null | grep NEEDED | tee -a "$LOG" || true

          if [ "$LINK_RC" -ne 0 ] || \
             [ "$NSS_VERSION" != "3.108" ] || \
             [ "$NSPR_VERSION" != "4.36.0" ] || \
             [ "$LIBDRM_VERSION" != "2.4.124" ]; then
            VERIFY_RC=1
          fi

          echo "SYSDEPS_INJECT_RC=$VERIFY_RC" | tee -a "$LOG"
          echo "SYSDEPS_INJECT_RC=$VERIFY_RC" >> "$GITHUB_ENV"
          echo "sysdeps_inject_rc=$VERIFY_RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Save upgraded system-dependency checkpoint
        if: ${{ steps.sysdeps_inject.conclusion == 'success' && steps.sysdeps_inject.outputs.sysdeps_inject_rc == '0' && steps.sysdeps_checkpoint.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/buildroot-nss-out
          key: lgwos-${{ env.SYSDEPS_CHECKPOINT_SCHEMA }}-${{ env.WEBOS_SDK_SHA256 }}-${{ env.BUILDROOT_REF }}

      - name: Restore Chromium incremental checkpoint
        id: chromium_checkpoint
        if: ${{ steps.sysdeps_inject.conclusion == 'success' && steps.sysdeps_inject.outputs.sysdeps_inject_rc == '0' }}
        uses: actions/cache/restore@v4
        with:
          path: src/out/LGWOS-Probe
          key: lgwos-${{ env.CHROMIUM_CHECKPOINT_SCHEMA }}-${{ env.LGWOS_TARGET_SHA }}-${{ env.WEBOS_SDK_SHA256 }}-${{ github.run_id }}
          restore-keys: |
            lgwos-${{ env.CHROMIUM_CHECKPOINT_SCHEMA }}-${{ env.LGWOS_TARGET_SHA }}-${{ env.WEBOS_SDK_SHA256 }}-

      - name: Generate incremental GN graph
        id: gn_gen
        if: ${{ steps.sysdeps_inject.conclusion == 'success' && steps.sysdeps_inject.outputs.sysdeps_inject_rc == '0' }}
        shell: bash
        run: |
          set -uo pipefail
          . "$SDK_ENV"
          cd "$GITHUB_WORKSPACE/src"

          TARGET_CC="$(command -v ${CC%% *})"
          TARGET_CXX="$(command -v ${CXX%% *})"
          TARGET_AR="$(command -v ${AR%% *})"
          TARGET_LD="$(command -v ${LD%% *})"
          TARGET_NM="$(command -v ${NM%% *})"
          TARGET_SYSROOT="$(${CC%% *} --print-sysroot)"

          HOST_CC="$(command -v gcc)"
          HOST_CXX="$(command -v g++)"
          HOST_AR="$(command -v ar)"
          HOST_NM="$(command -v nm)"

          ARGS_FILE="$GITHUB_WORKSPACE/lgwos-logs/args.gn"
          LOG="$GITHUB_WORKSPACE/lgwos-logs/gn-gen.log"

          cat > "$ARGS_FILE" <<EOF
          is_webos=true
          is_cross_linux_build=true
          is_clang=false
          is_debug=false
          is_component_build=false
          target_os="linux"
          target_cpu="arm"
          arm_arch="armv7-a"
          arm_version=7
          arm_float_abi="softfp"
          use_sysroot=false
          target_sysroot="$TARGET_SYSROOT"
          system_libdir="lib"
          pkg_config="/usr/bin/pkg-config"
          use_custom_libcxx=false
          host_toolchain="//build/toolchain/cros:host"
          cros_host_ar="$HOST_AR"
          cros_host_cc="$HOST_CC"
          cros_host_cxx="$HOST_CXX"
          cros_host_ld="$HOST_CXX"
          cros_host_nm="$HOST_NM"
          cros_host_sysroot="/"
          cros_target_ar="$TARGET_AR"
          cros_target_cc="$TARGET_CC"
          cros_target_cxx="$TARGET_CXX"
          cros_target_ld="$TARGET_LD"
          cros_target_nm="$TARGET_NM"
          webos_toolprefix="arm-webos-linux-gnueabi-"
          enable_nacl=false
          enable_print_preview=false
          enable_remoting=false
          use_cups=false
          use_kerberos=false
          use_gnome_keyring=false
          use_dbus=false
          use_pangocairo=false
          use_ozone=true
          ozone_auto_platforms=false
          fatal_linker_warnings=false
          use_debug_fission=false
          proprietary_codecs=true
          ffmpeg_branding="Chrome"
          EOF
          sed -i 's/^          //' "$ARGS_FILE"

          echo '=== GN ARGS ===' | tee "$LOG"
          cat "$ARGS_FILE" | tee -a "$LOG"
          echo "SYSDEPS_CHECKPOINT_MATCHED=${{ steps.sysdeps_checkpoint.outputs.cache-matched-key }}" | tee -a "$LOG"
          echo "CHROMIUM_CHECKPOINT_MATCHED=${{ steps.chromium_checkpoint.outputs.cache-matched-key }}" | tee -a "$LOG"
          echo '=== GN GEN ===' | tee -a "$LOG"

          set +e
          ./buildtools/linux64/gn gen "$OUT_DIR" \
            --args="$(cat "$ARGS_FILE")" \
            2>&1 | tee -a "$LOG"
          GN_RC=${PIPESTATUS[0]}
          set -e

          echo "GN_RC=$GN_RC" | tee -a "$LOG"
          echo "GN_RC=$GN_RC" >> "$GITHUB_ENV"
          echo "gn_rc=$GN_RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Inspect generated targets
        if: ${{ steps.gn_gen.conclusion == 'success' && steps.gn_gen.outputs.gn_rc == '0' }}
        shell: bash
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE/src"
          {
            echo '=== CHROME TARGET ==='
            ./buildtools/linux64/gn desc "$OUT_DIR" //chrome:chrome || true
            echo '=== WEBOS WEBRUNTIME TARGET ==='
            ./buildtools/linux64/gn desc "$OUT_DIR" //webos:weboswebruntime || true
          } > "$GITHUB_WORKSPACE/lgwos-logs/gn-targets.log" 2>&1
          tail -200 "$GITHUB_WORKSPACE/lgwos-logs/gn-targets.log"

      - name: Continue base build from checkpoint
        id: base_build
        if: ${{ steps.gn_gen.conclusion == 'success' && steps.gn_gen.outputs.gn_rc == '0' }}
        shell: bash
        run: |
          set -uo pipefail
          . "$SDK_ENV"
          cd "$GITHUB_WORKSPACE/src"

          set +e
          timeout 30m ninja -C "$OUT_DIR" -j2 base \
            2>&1 | tee "$GITHUB_WORKSPACE/lgwos-logs/base-build.log"
          BASE_RC=${PIPESTATUS[0]}
          set -e

          echo "BASE_BUILD_RC=$BASE_RC" | tee -a "$GITHUB_WORKSPACE/lgwos-logs/base-build.log"
          echo "BASE_BUILD_RC=$BASE_RC" >> "$GITHUB_ENV"
          echo "base_build_rc=$BASE_RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Assess Chromium checkpoint
        id: checkpoint_size
        if: ${{ always() && steps.gn_gen.conclusion == 'success' && steps.gn_gen.outputs.gn_rc == '0' }}
        shell: bash
        run: |
          set -uo pipefail
          OUT_PATH="$GITHUB_WORKSPACE/src/$OUT_DIR"
          LIMIT_KB=$((8 * 1024 * 1024))

          if [ ! -d "$OUT_PATH" ]; then
            echo 'save_ok=false' >> "$GITHUB_OUTPUT"
            echo 'CHROMIUM_CHECKPOINT_SAVE=NO_OUT_DIR'
            exit 0
          fi

          SIZE_KB="$(du -sk "$OUT_PATH" | awk '{print $1}')"
          echo "CHROMIUM_CHECKPOINT_SIZE_KB=$SIZE_KB"
          echo "CHROMIUM_CHECKPOINT_LIMIT_KB=$LIMIT_KB"

          if [ "$SIZE_KB" -le "$LIMIT_KB" ]; then
            echo 'save_ok=true' >> "$GITHUB_OUTPUT"
            echo 'CHROMIUM_CHECKPOINT_SAVE=YES'
          else
            echo 'save_ok=false' >> "$GITHUB_OUTPUT"
            echo 'CHROMIUM_CHECKPOINT_SAVE=SKIPPED_TOO_LARGE'
          fi

      - name: Save updated Chromium checkpoint
        if: ${{ always() && steps.gn_gen.conclusion == 'success' && steps.gn_gen.outputs.gn_rc == '0' && steps.checkpoint_size.outputs.save_ok == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: src/out/LGWOS-Probe
          key: lgwos-${{ env.CHROMIUM_CHECKPOINT_SCHEMA }}-${{ env.LGWOS_TARGET_SHA }}-${{ env.WEBOS_SDK_SHA256 }}-${{ github.run_id }}

      - name: Final incremental summary
        if: always()
        shell: bash
        run: |
          {
            echo "HEAD=$(git rev-parse HEAD 2>/dev/null || true)"
            echo "SYSDEPS_CHECKPOINT_HIT=${{ steps.sysdeps_checkpoint.outputs.cache-hit }}"
            echo "SYSDEPS_CHECKPOINT_MATCHED=${{ steps.sysdeps_checkpoint.outputs.cache-matched-key }}"
            echo "NSS_VALIDATE_RC=${NSS_VALIDATE_RC:-NOT_RUN}"
            echo "LIBDRM_BUILD_RC=${LIBDRM_BUILD_RC:-NOT_RUN}"
            echo "SYSDEPS_INJECT_RC=${SYSDEPS_INJECT_RC:-NOT_RUN}"
            echo "CHROMIUM_CHECKPOINT_MATCHED=${{ steps.chromium_checkpoint.outputs.cache-matched-key }}"
            echo "GN_RC=${GN_RC:-NOT_RUN}"
            echo "BASE_BUILD_RC=${BASE_BUILD_RC:-NOT_RUN}"
            echo '--- disk ---'
            df -h /
            echo '--- logs ---'
            find "$GITHUB_WORKSPACE/lgwos-logs" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
          } | tee "$GITHUB_WORKSPACE/lgwos-logs/final-summary.log"

      - name: Upload incremental logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lgwos-chr120-incremental-v2-logs
          path: lgwos-logs/
          if-no-files-found: warn
          retention-days: 14
