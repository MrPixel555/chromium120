name: LGWOS Chromium120 Incremental V3

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - LGWOS libdrm Checkpoint Fix V4
    types:
      - completed

permissions:
  contents: read

env:
  LGWOS_TARGET_SHA: e6a73fffdbe3bcc6f7fc33316c74adc6e7c01853
  WEBOS_SDK_URL: https://github.com/openlgtv/buildroot-nc4/releases/download/webos-a38c582/arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz
  WEBOS_SDK_SHA256: 04ad3311b48b4557a7002aef56ae2e167478e8e129f37daac04649bddf813616
  BUILDROOT_REF: a38c582ea397fec612811f8e933ae982d41fc5a3
  OUT_DIR: out/LGWOS-Probe
  SYSDEPS_CHECKPOINT_SCHEMA: sysdeps-v2
  CHROMIUM_CHECKPOINT_SCHEMA: chromium-out-v2

jobs:
  incremental:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Runner cleanup
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          sudo apt-get clean || true
          df -h /

      - name: Checkout exact Chromium 120 source
        uses: actions/checkout@v4
        with:
          ref: e6a73fffdbe3bcc6f7fc33316c74adc6e7c01853
          fetch-depth: 1
          submodules: false
          lfs: false
          clean: true

      - name: Install host prerequisites and GLib development metadata
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            binutils \
            bzip2 \
            ca-certificates \
            cpio \
            curl \
            file \
            gcc \
            g++ \
            gzip \
            libglib2.0-dev \
            make \
            ninja-build \
            patch \
            perl \
            pkg-config \
            python3 \
            python3-six \
            rsync \
            tar \
            unzip \
            wget \
            xz-utils

      - name: Create Debian multiarch pkg-config bridge for Chromium host toolchain
        id: host_pkgconfig
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/lgwos-logs"
          LOG="$GITHUB_WORKSPACE/lgwos-logs/host-pkgconfig.log"

          HOST_MULTIARCH="$(gcc -print-multiarch)"
          HOST_PC_DIR="/usr/lib/$HOST_MULTIARCH/pkgconfig"
          test -d "$HOST_PC_DIR"

          sudo mkdir -p /usr/lib/pkgconfig
          COUNT=0
          for PC in "$HOST_PC_DIR"/*.pc; do
            if [ -f "$PC" ]; then
              sudo ln -sfn "$PC" "/usr/lib/pkgconfig/$(basename "$PC")"
              COUNT=$((COUNT + 1))
            fi
          done

          {
            echo "HOST_MULTIARCH=$HOST_MULTIARCH"
            echo "HOST_PC_DIR=$HOST_PC_DIR"
            echo "HOST_PC_BRIDGE_COUNT=$COUNT"
            echo "PKG_CONFIG_PC_PATH=$(/usr/bin/pkg-config --variable pc_path pkg-config 2>/dev/null || true)"
            echo '=== HOST GLIB DIRECT PKG-CONFIG ==='
            /usr/bin/pkg-config --modversion glib-2.0
            /usr/bin/pkg-config --modversion gmodule-2.0
            /usr/bin/pkg-config --modversion gobject-2.0
            /usr/bin/pkg-config --modversion gthread-2.0
            echo '=== BRIDGED PC FILES ==='
            for P in glib-2.0 gmodule-2.0 gobject-2.0 gthread-2.0; do
              test -e "/usr/lib/pkgconfig/$P.pc"
              readlink -f "/usr/lib/pkgconfig/$P.pc"
            done
          } | tee "$LOG"

          echo "host_pkgconfig_rc=0" >> "$GITHUB_OUTPUT"

      - name: Download and relocate webOS SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ARCHIVE="$RUNNER_TEMP/webos-sdk.tar.gz"

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 20 \
            -o "$SDK_ARCHIVE" \
            "$WEBOS_SDK_URL"

          echo "$WEBOS_SDK_SHA256  $SDK_ARCHIVE" | sha256sum -c -

          sudo rm -rf /opt/lgwos-sdk
          sudo mkdir -p /opt/lgwos-sdk
          sudo tar -xzf "$SDK_ARCHIVE" -C /opt/lgwos-sdk
          rm -f "$SDK_ARCHIVE"
          sudo chown -R "$USER:$USER" /opt/lgwos-sdk

          SDK_ENV="$(find /opt/lgwos-sdk -type f -name environment-setup -print -quit)"
          test -n "$SDK_ENV"
          SDK_DIR="$(dirname "$SDK_ENV")"
          if [ -x "$SDK_DIR/relocate-sdk.sh" ]; then
            "$SDK_DIR/relocate-sdk.sh"
          fi

          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"
          echo "SDK_ENV=$SDK_ENV" >> "$GITHUB_ENV"

          . "$SDK_ENV"
          TARGET_SYSROOT="$(${CC%% *} --print-sysroot)"
          echo "TARGET_SYSROOT=$TARGET_SYSROOT" >> "$GITHUB_ENV"

          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "SDK_DIR=$SDK_DIR"
            echo "SDK_ENV=$SDK_ENV"
            echo "TARGET_SYSROOT=$TARGET_SYSROOT"
            ${CC%% *} --version
            df -h /
          } | tee "$GITHUB_WORKSPACE/lgwos-logs/bootstrap.log"

          test "$(git rev-parse HEAD)" = "$LGWOS_TARGET_SHA"

      - name: Restore exact validated sysdeps v2 checkpoint
        id: sysdeps_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/buildroot-nss-out
          key: lgwos-${{ env.SYSDEPS_CHECKPOINT_SCHEMA }}-${{ env.WEBOS_SDK_SHA256 }}-${{ env.BUILDROOT_REF }}
          fail-on-cache-miss: true

      - name: Revalidate cached NSS and legacy-safe libdrm
        id: sysdeps_validate
        shell: bash
        run: |
          set -uo pipefail
          . "$SDK_ENV"

          LOG="$GITHUB_WORKSPACE/lgwos-logs/sysdeps-validation.log"
          BUILDROOT_OUT="$RUNNER_TEMP/buildroot-nss-out"
          TARGET_CC="$BUILDROOT_OUT/host/bin/arm-webos-linux-gnueabi-gcc"
          TARGET_READELF="$BUILDROOT_OUT/host/bin/arm-webos-linux-gnueabi-readelf"
          STAGING_DIR="$($TARGET_CC --print-sysroot 2>/dev/null || true)"
          RC=0

          {
            echo "SYSDEPS_CACHE_HIT=${{ steps.sysdeps_cache.outputs.cache-hit }}"
            echo "STAGING_DIR=$STAGING_DIR"
          } | tee "$LOG"

          for F in \
            "$STAGING_DIR/usr/lib/pkgconfig/nspr.pc" \
            "$STAGING_DIR/usr/lib/pkgconfig/nss.pc" \
            "$STAGING_DIR/usr/lib/pkgconfig/libdrm.pc" \
            "$STAGING_DIR/usr/lib/libnspr4.so" \
            "$STAGING_DIR/usr/lib/libnss3.so"
          do
            if [ -e "$F" ]; then
              echo "SYSDEP_OK=$F" | tee -a "$LOG"
            else
              echo "SYSDEP_MISSING=$F" | tee -a "$LOG"
              RC=1
            fi
          done

          REAL_LIBDRM="$(find "$STAGING_DIR/usr/lib" -maxdepth 1 -type f -name 'libdrm.so.*' -print | sort | head -1)"
          if [ -z "$REAL_LIBDRM" ]; then
            echo 'SYSDEP_MISSING=real libdrm shared object' | tee -a "$LOG"
            RC=2
          else
            echo "REAL_LIBDRM=$REAL_LIBDRM" | tee -a "$LOG"
            echo '=== LIBDRM DT_NEEDED ===' | tee -a "$LOG"
            "$TARGET_READELF" -d "$REAL_LIBDRM" 2>/dev/null | grep NEEDED | tee -a "$LOG" || true
            if "$TARGET_READELF" -d "$REAL_LIBDRM" 2>/dev/null | grep -q 'libudev'; then
              echo 'SYSDEP_ABI_ERROR=libdrm depends on libudev' | tee -a "$LOG"
              RC=3
            fi

            MAX_GLIBC="$("$TARGET_READELF" --version-info "$REAL_LIBDRM" 2>/dev/null | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -1 || true)"
            echo "LIBDRM_MAX_GLIBC=$MAX_GLIBC" | tee -a "$LOG"
            if [ -n "$MAX_GLIBC" ]; then
              HIGHEST="$(printf '%s\n' GLIBC_2.14 "$MAX_GLIBC" | sort -V | tail -1)"
              if [ "$HIGHEST" != "GLIBC_2.14" ]; then
                echo "SYSDEP_ABI_ERROR=libdrm GLIBC ceiling:$MAX_GLIBC" | tee -a "$LOG"
                RC=4
              fi
            fi
          fi

          echo "SYSDEPS_VALIDATE_RC=$RC" | tee -a "$LOG"
          echo "SYSDEPS_VALIDATE_RC=$RC" >> "$GITHUB_ENV"
          echo "sysdeps_validate_rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Inject validated sysdeps into fresh SDK
        id: sysdeps_inject
        if: ${{ steps.sysdeps_validate.conclusion == 'success' && steps.sysdeps_validate.outputs.sysdeps_validate_rc == '0' }}
        shell: bash
        run: |
          set -uo pipefail
          . "$SDK_ENV"

          LOG="$GITHUB_WORKSPACE/lgwos-logs/sysdeps-inject.log"
          BUILDROOT_OUT="$RUNNER_TEMP/buildroot-nss-out"
          BUILDROOT_TARGET_CC="$BUILDROOT_OUT/host/bin/arm-webos-linux-gnueabi-gcc"
          STAGING_DIR="$($BUILDROOT_TARGET_CC --print-sysroot 2>/dev/null || true)"
          TARGET_SYSROOT="$(${CC%% *} --print-sysroot)"
          RC=0

          install -d \
            "$TARGET_SYSROOT/usr/include/nspr" \
            "$TARGET_SYSROOT/usr/include/nss" \
            "$TARGET_SYSROOT/usr/include/libdrm" \
            "$TARGET_SYSROOT/usr/lib/pkgconfig"

          rsync -a "$STAGING_DIR/usr/include/nspr/" "$TARGET_SYSROOT/usr/include/nspr/"
          rsync -a "$STAGING_DIR/usr/include/nss/" "$TARGET_SYSROOT/usr/include/nss/"
          rsync -a "$STAGING_DIR/usr/include/libdrm/" "$TARGET_SYSROOT/usr/include/libdrm/"
          cp -a "$STAGING_DIR/usr/include/xf86drm.h" "$TARGET_SYSROOT/usr/include/"
          cp -a "$STAGING_DIR/usr/include/xf86drmMode.h" "$TARGET_SYSROOT/usr/include/"

          for PC in nspr.pc nss.pc libdrm.pc; do
            cp -a "$STAGING_DIR/usr/lib/pkgconfig/$PC" "$TARGET_SYSROOT/usr/lib/pkgconfig/"
          done

          for GLOB in \
            'libnspr4.so*' \
            'libplc4.so*' \
            'libplds4.so*' \
            'libnss*.so*' \
            'libsmime3.so*' \
            'libssl3.so*' \
            'libsoftokn3.so*' \
            'libfreebl*.so*' \
            'libdrm.so*'
          do
            for F in "$STAGING_DIR/usr/lib"/$GLOB; do
              if [ -e "$F" ]; then
                cp -a "$F" "$TARGET_SYSROOT/usr/lib/"
              fi
            done
          done

          export PKG_CONFIG_SYSROOT_DIR="$TARGET_SYSROOT"
          export PKG_CONFIG_LIBDIR="$TARGET_SYSROOT/usr/lib/pkgconfig:$TARGET_SYSROOT/usr/share/pkgconfig"

          NSS_VERSION="$(/usr/bin/pkg-config --modversion nss 2>/dev/null || true)"
          NSPR_VERSION="$(/usr/bin/pkg-config --modversion nspr 2>/dev/null || true)"
          LIBDRM_VERSION="$(/usr/bin/pkg-config --modversion libdrm 2>/dev/null || true)"

          {
            echo "NSS_VERSION=$NSS_VERSION"
            echo "NSPR_VERSION=$NSPR_VERSION"
            echo "LIBDRM_VERSION=$LIBDRM_VERSION"
          } | tee "$LOG"

          if [ "$NSS_VERSION" != "3.108" ] || [ "$NSPR_VERSION" != "4.36.0" ] || [ "$LIBDRM_VERSION" != "2.4.124" ]; then
            RC=1
          fi

          cat > "$RUNNER_TEMP/lgwos-sysdeps-probe.c" <<'EOF'
          #include <nss.h>
          #include <xf86drm.h>
          int main(void) {
            drmVersionPtr version = drmGetVersion(-1);
            if (version) drmFreeVersion(version);
            return NSS_VersionCheck("3.0") ? 0 : 1;
          }
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/lgwos-sysdeps-probe.c"

          CFLAGS="$(/usr/bin/pkg-config --cflags nss libdrm 2>/dev/null || true)"
          LIBS="$(/usr/bin/pkg-config --libs nss libdrm 2>/dev/null || true)"

          set +e
          ${CC%% *} $CFLAGS "$RUNNER_TEMP/lgwos-sysdeps-probe.c" $LIBS \
            -o "$RUNNER_TEMP/lgwos-sysdeps-probe" \
            2>&1 | tee -a "$LOG"
          LINK_RC=${PIPESTATUS[0]}
          set -e

          echo "SYSDEPS_LINK_PROBE_RC=$LINK_RC" | tee -a "$LOG"
          file "$RUNNER_TEMP/lgwos-sysdeps-probe" 2>/dev/null | tee -a "$LOG" || true
          if [ "$LINK_RC" -ne 0 ]; then
            RC=2
          fi

          echo "SYSDEPS_INJECT_RC=$RC" | tee -a "$LOG"
          echo "SYSDEPS_INJECT_RC=$RC" >> "$GITHUB_ENV"
          echo "sysdeps_inject_rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Audit host and target GLib through Chromium pkg-config wrapper
        id: glib_audit
        if: ${{ steps.sysdeps_inject.conclusion == 'success' && steps.sysdeps_inject.outputs.sysdeps_inject_rc == '0' }}
        shell: bash
        run: |
          set -uo pipefail
          . "$SDK_ENV"
          cd "$GITHUB_WORKSPACE/src"

          LOG="$GITHUB_WORKSPACE/lgwos-logs/glib-audit.log"
          TARGET_SYSROOT="$(${CC%% *} --print-sysroot)"
          RC=0

          {
            echo '=== HOST GLIB VIA CHROMIUM WRAPPER ==='
            echo 'Expected host path: /usr/lib/pkgconfig after multiarch bridge'
          } | tee "$LOG"

          set +e
          /usr/bin/python3 build/config/linux/pkg-config.py \
            -s / \
            -a x64 \
            --system_libdir lib \
            -p /usr/bin/pkg-config \
            glib-2.0 gmodule-2.0 gobject-2.0 gthread-2.0 \
            >> "$LOG" 2>&1
          HOST_RC=$?

          /usr/bin/python3 build/config/linux/pkg-config.py \
            -s "$TARGET_SYSROOT" \
            -a arm \
            --system_libdir lib \
            -p /usr/bin/pkg-config \
            glib-2.0 gmodule-2.0 gobject-2.0 gthread-2.0 \
            >> "$LOG" 2>&1
          TARGET_RC=$?
          set -e

          {
            echo "HOST_GLIB_PKGCONFIG_RC=$HOST_RC"
            echo "TARGET_GLIB_PKGCONFIG_RC=$TARGET_RC"
          } | tee -a "$LOG"

          if [ "$HOST_RC" -ne 0 ]; then RC=1; fi
          if [ "$TARGET_RC" -ne 0 ]; then RC=2; fi

          echo "GLIB_AUDIT_RC=$RC" | tee -a "$LOG"
          echo "GLIB_AUDIT_RC=$RC" >> "$GITHUB_ENV"
          echo "glib_audit_rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Restore Chromium incremental checkpoint
        id: chromium_cache
        if: ${{ steps.glib_audit.conclusion == 'success' && steps.glib_audit.outputs.glib_audit_rc == '0' }}
        uses: actions/cache/restore@v4
        with:
          path: src/out/LGWOS-Probe
          key: lgwos-${{ env.CHROMIUM_CHECKPOINT_SCHEMA }}-${{ env.LGWOS_TARGET_SHA }}-${{ env.WEBOS_SDK_SHA256 }}-${{ github.run_id }}
          restore-keys: |
            lgwos-${{ env.CHROMIUM_CHECKPOINT_SCHEMA }}-${{ env.LGWOS_TARGET_SHA }}-${{ env.WEBOS_SDK_SHA256 }}-

      - name: Generate GN graph
        id: gn_gen
        if: ${{ steps.glib_audit.conclusion == 'success' && steps.glib_audit.outputs.glib_audit_rc == '0' }}
        shell: bash
        run: |
          set -uo pipefail
          . "$SDK_ENV"
          cd "$GITHUB_WORKSPACE/src"

          TARGET_CC="$(command -v ${CC%% *})"
          TARGET_CXX="$(command -v ${CXX%% *})"
          TARGET_AR="$(command -v ${AR%% *})"
          TARGET_LD="$(command -v ${LD%% *})"
          TARGET_NM="$(command -v ${NM%% *})"
          TARGET_SYSROOT="$(${CC%% *} --print-sysroot)"

          HOST_CC="$(command -v gcc)"
          HOST_CXX="$(command -v g++)"
          HOST_AR="$(command -v ar)"
          HOST_NM="$(command -v nm)"

          ARGS_FILE="$GITHUB_WORKSPACE/lgwos-logs/args.gn"
          LOG="$GITHUB_WORKSPACE/lgwos-logs/gn-gen.log"

          cat > "$ARGS_FILE" <<EOF
          is_webos=true
          is_cross_linux_build=true
          is_clang=false
          is_debug=false
          is_component_build=false
          target_os="linux"
          target_cpu="arm"
          arm_arch="armv7-a"
          arm_version=7
          arm_float_abi="softfp"
          use_sysroot=false
          target_sysroot="$TARGET_SYSROOT"
          system_libdir="lib"
          pkg_config="/usr/bin/pkg-config"
          use_custom_libcxx=false
          host_toolchain="//build/toolchain/cros:host"
          cros_host_ar="$HOST_AR"
          cros_host_cc="$HOST_CC"
          cros_host_cxx="$HOST_CXX"
          cros_host_ld="$HOST_CXX"
          cros_host_nm="$HOST_NM"
          cros_host_sysroot="/"
          cros_target_ar="$TARGET_AR"
          cros_target_cc="$TARGET_CC"
          cros_target_cxx="$TARGET_CXX"
          cros_target_ld="$TARGET_LD"
          cros_target_nm="$TARGET_NM"
          webos_toolprefix="arm-webos-linux-gnueabi-"
          enable_nacl=false
          enable_print_preview=false
          enable_remoting=false
          use_cups=false
          use_kerberos=false
          use_gnome_keyring=false
          use_dbus=false
          use_pangocairo=false
          use_ozone=true
          ozone_auto_platforms=false
          fatal_linker_warnings=false
          use_debug_fission=false
          proprietary_codecs=true
          ffmpeg_branding="Chrome"
          EOF
          sed -i 's/^          //' "$ARGS_FILE"

          echo '=== GN ARGS ===' | tee "$LOG"
          cat "$ARGS_FILE" | tee -a "$LOG"
          echo '=== GN GEN ===' | tee -a "$LOG"

          set +e
          ./buildtools/linux64/gn gen "$OUT_DIR" \
            --args="$(cat "$ARGS_FILE")" \
            2>&1 | tee -a "$LOG"
          GN_RC=${PIPESTATUS[0]}
          set -e

          echo "GN_RC=$GN_RC" | tee -a "$LOG"
          echo "GN_RC=$GN_RC" >> "$GITHUB_ENV"
          echo "gn_rc=$GN_RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Inspect generated targets
        if: ${{ steps.gn_gen.conclusion == 'success' && steps.gn_gen.outputs.gn_rc == '0' }}
        shell: bash
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE/src"
          {
            echo '=== CHROME TARGET ==='
            ./buildtools/linux64/gn desc "$OUT_DIR" //chrome:chrome || true
            echo '=== WEBOS WEBRUNTIME TARGET ==='
            ./buildtools/linux64/gn desc "$OUT_DIR" //webos:weboswebruntime || true
          } > "$GITHUB_WORKSPACE/lgwos-logs/gn-targets.log" 2>&1
          tail -200 "$GITHUB_WORKSPACE/lgwos-logs/gn-targets.log"

      - name: Continue base build from checkpoint
        id: base_build
        if: ${{ steps.gn_gen.conclusion == 'success' && steps.gn_gen.outputs.gn_rc == '0' }}
        shell: bash
        run: |
          set -uo pipefail
          . "$SDK_ENV"
          cd "$GITHUB_WORKSPACE/src"

          set +e
          timeout 30m ninja -C "$OUT_DIR" -j2 base \
            2>&1 | tee "$GITHUB_WORKSPACE/lgwos-logs/base-build.log"
          RC=${PIPESTATUS[0]}
          set -e

          echo "BASE_BUILD_RC=$RC" | tee -a "$GITHUB_WORKSPACE/lgwos-logs/base-build.log"
          echo "BASE_BUILD_RC=$RC" >> "$GITHUB_ENV"
          echo "base_build_rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Assess Chromium checkpoint
        id: chromium_size
        if: ${{ always() && steps.gn_gen.conclusion == 'success' && steps.gn_gen.outputs.gn_rc == '0' }}
        shell: bash
        run: |
          set -uo pipefail
          OUT_PATH="$GITHUB_WORKSPACE/src/$OUT_DIR"
          LIMIT_KB=$((8 * 1024 * 1024))
          if [ ! -d "$OUT_PATH" ]; then
            echo 'save_ok=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SIZE_KB="$(du -sk "$OUT_PATH" | awk '{print $1}')"
          echo "CHROMIUM_CHECKPOINT_SIZE_KB=$SIZE_KB"
          echo "CHROMIUM_CHECKPOINT_LIMIT_KB=$LIMIT_KB"
          if [ "$SIZE_KB" -le "$LIMIT_KB" ]; then
            echo 'save_ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'save_ok=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Save updated Chromium checkpoint
        if: ${{ always() && steps.gn_gen.conclusion == 'success' && steps.gn_gen.outputs.gn_rc == '0' && steps.chromium_size.outputs.save_ok == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: src/out/LGWOS-Probe
          key: lgwos-${{ env.CHROMIUM_CHECKPOINT_SCHEMA }}-${{ env.LGWOS_TARGET_SHA }}-${{ env.WEBOS_SDK_SHA256 }}-${{ github.run_id }}

      - name: Final incremental summary
        if: always()
        shell: bash
        run: |
          {
            echo "HEAD=$(git rev-parse HEAD 2>/dev/null || true)"
            echo "SYSDEPS_CACHE_HIT=${{ steps.sysdeps_cache.outputs.cache-hit }}"
            echo "SYSDEPS_VALIDATE_RC=${SYSDEPS_VALIDATE_RC:-NOT_RUN}"
            echo "SYSDEPS_INJECT_RC=${SYSDEPS_INJECT_RC:-NOT_RUN}"
            echo "GLIB_AUDIT_RC=${GLIB_AUDIT_RC:-NOT_RUN}"
            echo "GN_RC=${GN_RC:-NOT_RUN}"
            echo "BASE_BUILD_RC=${BASE_BUILD_RC:-NOT_RUN}"
            df -h /
            find "$GITHUB_WORKSPACE/lgwos-logs" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
          } | tee "$GITHUB_WORKSPACE/lgwos-logs/final-summary.log"

      - name: Upload incremental logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lgwos-chr120-incremental-v3-logs
          path: lgwos-logs/
          if-no-files-found: warn
          retention-days: 14
