name: LGWOS libdrm Checkpoint Fix

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/lgwos-libdrm-checkpoint-fix.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: lgwos-libdrm-checkpoint-fix
  cancel-in-progress: true

env:
  WEBOS_SDK_URL: https://github.com/openlgtv/buildroot-nc4/releases/download/webos-a38c582/arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz
  WEBOS_SDK_SHA256: 04ad3311b48b4557a7002aef56ae2e167478e8e129f37daac04649bddf813616
  BUILDROOT_REF: a38c582ea397fec612811f8e933ae982d41fc5a3
  NSS_CHECKPOINT_SCHEMA: nss-v1
  SYSDEPS_CHECKPOINT_SCHEMA: sysdeps-v1

jobs:
  repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Runner cleanup
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          sudo apt-get clean || true
          df -h /

      - name: Install host prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            binutils \
            bzip2 \
            ca-certificates \
            cpio \
            curl \
            file \
            gcc \
            g++ \
            gzip \
            make \
            ninja-build \
            patch \
            perl \
            pkg-config \
            python3 \
            python3-six \
            rsync \
            tar \
            unzip \
            wget \
            xz-utils

      - name: Download and relocate webOS SDK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/lgwos-logs"
          SDK_ARCHIVE="$RUNNER_TEMP/webos-sdk.tar.gz"

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 20 \
            -o "$SDK_ARCHIVE" \
            "$WEBOS_SDK_URL"

          echo "$WEBOS_SDK_SHA256  $SDK_ARCHIVE" | sha256sum -c -

          sudo rm -rf /opt/lgwos-sdk
          sudo mkdir -p /opt/lgwos-sdk
          sudo tar -xzf "$SDK_ARCHIVE" -C /opt/lgwos-sdk
          rm -f "$SDK_ARCHIVE"
          sudo chown -R "$USER:$USER" /opt/lgwos-sdk

          SDK_ENV="$(find /opt/lgwos-sdk -type f -name environment-setup -print -quit)"
          test -n "$SDK_ENV"
          SDK_DIR="$(dirname "$SDK_ENV")"

          if [ -x "$SDK_DIR/relocate-sdk.sh" ]; then
            "$SDK_DIR/relocate-sdk.sh"
          fi

          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"
          echo "SDK_ENV=$SDK_ENV" >> "$GITHUB_ENV"

          . "$SDK_ENV"
          TARGET_SYSROOT="$(${CC%% *} --print-sysroot)"
          echo "TARGET_SYSROOT=$TARGET_SYSROOT" >> "$GITHUB_ENV"

          {
            echo "SDK_DIR=$SDK_DIR"
            echo "SDK_ENV=$SDK_ENV"
            echo "TARGET_SYSROOT=$TARGET_SYSROOT"
            ${CC%% *} --version
            df -h /
          } | tee "$GITHUB_WORKSPACE/lgwos-logs/bootstrap.log"

      - name: Restore validated NSS checkpoint
        id: nss_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/buildroot-nss-out
          key: lgwos-${{ env.NSS_CHECKPOINT_SCHEMA }}-${{ env.WEBOS_SDK_SHA256 }}-${{ env.BUILDROOT_REF }}
          fail-on-cache-miss: true

      - name: Validate checkpoint and audit host header contamination
        id: host_audit
        shell: bash
        run: |
          set -uo pipefail
          . "$SDK_ENV"

          LOG="$GITHUB_WORKSPACE/lgwos-logs/host-header-audit.log"
          BUILDROOT_OUT="$RUNNER_TEMP/buildroot-nss-out"
          HOST_DIR="$BUILDROOT_OUT/host"
          BUILDROOT_TARGET_CC="$HOST_DIR/bin/arm-webos-linux-gnueabi-gcc"
          STAGING_DIR="$($BUILDROOT_TARGET_CC --print-sysroot 2>/dev/null || true)"

          VERIFY_RC=0
          for F in \
            "$STAGING_DIR/usr/lib/pkgconfig/nspr.pc" \
            "$STAGING_DIR/usr/lib/pkgconfig/nss.pc" \
            "$STAGING_DIR/usr/lib/libnspr4.so" \
            "$STAGING_DIR/usr/lib/libnss3.so" \
            "$STAGING_DIR/usr/lib/libssl3.so"
          do
            if [ -e "$F" ]; then
              echo "CHECKPOINT_OK=$F" | tee -a "$LOG"
            else
              echo "CHECKPOINT_MISSING=$F" | tee -a "$LOG"
              VERIFY_RC=1
            fi
          done

          echo '=== HOST INCLUDE TOP LEVEL ===' | tee -a "$LOG"
          find "$HOST_DIR/include" -maxdepth 2 -type f -printf '%P\n' 2>/dev/null | sort | tee -a "$LOG" || true

          echo '=== SUSPICIOUS HOST HEADERS ===' | tee -a "$LOG"
          find "$HOST_DIR/include" -maxdepth 2 -type f \
            \( -name 'stdint.h' -o -name 'inttypes.h' -o -name 'limits.h' -o -name 'stddef.h' \) \
            -print -exec sh -c 'echo "--- $1"; grep -nE "uintptr_t|intptr_t|__UINTPTR|__INTPTR" "$1" | head -40 || true' _ {} \; \
            2>&1 | tee -a "$LOG" || true

          cat > "$RUNNER_TEMP/lgwos-host-abi-probe.cc" <<'EOF'
          #include <cstdint>
          #include <cstddef>
          static_assert(sizeof(uintptr_t) == sizeof(void*), "uintptr_t size mismatch");
          int main() { return 0; }
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/lgwos-host-abi-probe.cc"

          set +e
          /usr/bin/g++ -std=c++17 -O2 \
            "$RUNNER_TEMP/lgwos-host-abi-probe.cc" \
            -o "$RUNNER_TEMP/lgwos-host-abi-clean" \
            >> "$LOG" 2>&1
          CLEAN_RC=$?

          /usr/bin/g++ -std=c++17 -O2 -I"$HOST_DIR/include" \
            "$RUNNER_TEMP/lgwos-host-abi-probe.cc" \
            -o "$RUNNER_TEMP/lgwos-host-abi-with-host-include" \
            >> "$LOG" 2>&1
          HOST_INCLUDE_RC=$?

          /usr/bin/g++ -std=c++17 -I"$HOST_DIR/include" -H -E \
            "$RUNNER_TEMP/lgwos-host-abi-probe.cc" \
            >/dev/null 2>"$RUNNER_TEMP/lgwos-host-include-trace.txt"
          TRACE_RC=$?
          set -e

          {
            echo "HOST_ABI_CLEAN_RC=$CLEAN_RC"
            echo "HOST_ABI_WITH_BUILDROOT_INCLUDE_RC=$HOST_INCLUDE_RC"
            echo "HOST_ABI_TRACE_RC=$TRACE_RC"
            echo '=== BUILDROOT HOST INCLUDE TRACE ==='
            grep -F "$HOST_DIR/include" "$RUNNER_TEMP/lgwos-host-include-trace.txt" | head -100 || true
          } | tee -a "$LOG"

          if [ "$CLEAN_RC" -ne 0 ]; then
            VERIFY_RC=2
          fi

          echo "HOST_AUDIT_RC=$VERIFY_RC" | tee -a "$LOG"
          echo "host_audit_rc=$VERIFY_RC" >> "$GITHUB_OUTPUT"
          echo "HOST_AUDIT_RC=$VERIFY_RC" >> "$GITHUB_ENV"

      - name: Fetch exact Buildroot source
        if: ${{ steps.host_audit.outputs.host_audit_rc == '0' }}
        shell: bash
        run: |
          set -euxo pipefail
          BUILDROOT_SRC="$RUNNER_TEMP/buildroot-nc4"
          BUILDROOT_TARBALL="$RUNNER_TEMP/buildroot-nc4.tar.gz"

          rm -rf "$BUILDROOT_SRC" "$BUILDROOT_TARBALL"
          mkdir -p "$BUILDROOT_SRC"

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 20 \
            -o "$BUILDROOT_TARBALL" \
            "https://codeload.github.com/openlgtv/buildroot-nc4/tar.gz/$BUILDROOT_REF"

          tar -xzf "$BUILDROOT_TARBALL" --strip-components=1 -C "$BUILDROOT_SRC"
          rm -f "$BUILDROOT_TARBALL"

          python3 - "$BUILDROOT_SRC/toolchain/helpers.mk" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          lines = path.read_text().splitlines(True)
          out = []
          restoring = False
          restored = False

          for line in lines:
              if line.startswith("#check_kernel_headers_version ="):
                  restoring = True
                  restored = True
              if restoring and line.startswith("#"):
                  line = line[1:]
              out.append(line)
              if restoring and line.lstrip().startswith("fi"):
                  restoring = False

          if not restored:
              raise SystemExit("expected commented check_kernel_headers_version block not found")

          path.write_text("".join(out))
          PY

      - name: Build host Ninja with sanitized host ABI
        id: host_ninja
        if: ${{ steps.host_audit.outputs.host_audit_rc == '0' }}
        shell: bash
        run: |
          set -uo pipefail
          . "$SDK_ENV"

          LOG="$GITHUB_WORKSPACE/lgwos-logs/host-ninja-sanitized.log"
          BUILDROOT_SRC="$RUNNER_TEMP/buildroot-nc4"
          BUILDROOT_OUT="$RUNNER_TEMP/buildroot-nss-out"

          rm -rf "$BUILDROOT_OUT/build/host-ninja-1.11.1.g95dee.kitware.jobserver-1"

          echo '=== SANITIZED HOST-NINJA BUILD ===' | tee "$LOG"
          echo 'HOST_CPPFLAGS=<empty>' | tee -a "$LOG"
          echo 'HOST_CFLAGS=-O2' | tee -a "$LOG"
          echo 'HOST_CXXFLAGS=-O2' | tee -a "$LOG"
          echo 'HOST_LDFLAGS=<empty>' | tee -a "$LOG"

          set +e
          make -C "$BUILDROOT_SRC" O="$BUILDROOT_OUT" -j4 \
            HOST_CPPFLAGS= \
            HOST_CFLAGS=-O2 \
            HOST_CXXFLAGS=-O2 \
            HOST_LDFLAGS= \
            host-ninja \
            2>&1 | tee -a "$LOG"
          RC=${PIPESTATUS[0]}
          set -e

          echo "HOST_NINJA_BUILD_RC=$RC" | tee -a "$LOG"
          if [ "$RC" -eq 0 ]; then
            "$BUILDROOT_OUT/host/bin/ninja" --version 2>&1 | tee -a "$LOG" || true
            file "$BUILDROOT_OUT/host/bin/ninja" 2>&1 | tee -a "$LOG" || true
          fi

          echo "host_ninja_rc=$RC" >> "$GITHUB_OUTPUT"
          echo "HOST_NINJA_BUILD_RC=$RC" >> "$GITHUB_ENV"
          exit 0

      - name: Build ABI-compatible libdrm 2.4.124
        id: libdrm
        if: ${{ steps.host_ninja.outputs.host_ninja_rc == '0' }}
        shell: bash
        run: |
          set -uo pipefail
          . "$SDK_ENV"

          LOG="$GITHUB_WORKSPACE/lgwos-logs/libdrm-build.log"
          BUILDROOT_SRC="$RUNNER_TEMP/buildroot-nc4"
          BUILDROOT_OUT="$RUNNER_TEMP/buildroot-nss-out"
          BUILDROOT_TARGET_CC="$BUILDROOT_OUT/host/bin/arm-webos-linux-gnueabi-gcc"
          STAGING_DIR="$($BUILDROOT_TARGET_CC --print-sysroot 2>/dev/null || true)"

          set +e
          make -C "$BUILDROOT_SRC" O="$BUILDROOT_OUT" -j4 libdrm \
            2>&1 | tee "$LOG"
          BUILD_RC=${PIPESTATUS[0]}
          set -e

          echo "BUILDROOT_LIBDRM_RC=$BUILD_RC" | tee -a "$LOG"
          if [ "$BUILD_RC" -ne 0 ]; then
            echo "libdrm_rc=$BUILD_RC" >> "$GITHUB_OUTPUT"
            echo "LIBDRM_BUILD_RC=$BUILD_RC" >> "$GITHUB_ENV"
            exit 0
          fi

          VERIFY_RC=0
          for F in \
            "$STAGING_DIR/usr/lib/pkgconfig/libdrm.pc" \
            "$STAGING_DIR/usr/include/xf86drm.h" \
            "$STAGING_DIR/usr/include/xf86drmMode.h" \
            "$STAGING_DIR/usr/include/libdrm/drm.h"
          do
            if [ -e "$F" ]; then
              echo "LIBDRM_OK=$F" | tee -a "$LOG"
            else
              echo "LIBDRM_MISSING=$F" | tee -a "$LOG"
              VERIFY_RC=1
            fi
          done

          if ! ls "$STAGING_DIR/usr/lib"/libdrm.so* >/dev/null 2>&1; then
            echo 'LIBDRM_MISSING=libdrm.so*' | tee -a "$LOG"
            VERIFY_RC=1
          fi

          export PKG_CONFIG_SYSROOT_DIR="$STAGING_DIR"
          export PKG_CONFIG_LIBDIR="$STAGING_DIR/usr/lib/pkgconfig:$STAGING_DIR/usr/share/pkgconfig"
          LIBDRM_VERSION="$(/usr/bin/pkg-config --modversion libdrm 2>/dev/null || true)"
          echo "LIBDRM_VERSION=$LIBDRM_VERSION" | tee -a "$LOG"
          if [ "$LIBDRM_VERSION" != "2.4.124" ]; then
            VERIFY_RC=1
          fi

          echo '=== LIBDRM ABI AUDIT ===' | tee -a "$LOG"
          for F in "$STAGING_DIR/usr/lib"/libdrm.so*; do
            if [ -e "$F" ] && [ ! -L "$F" ]; then
              echo "--- $(basename "$F") ---" | tee -a "$LOG"
              file "$F" | tee -a "$LOG" || true
              "$BUILDROOT_OUT/host/bin/arm-webos-linux-gnueabi-readelf" -A "$F" 2>/dev/null | tee -a "$LOG" || true
              "$BUILDROOT_OUT/host/bin/arm-webos-linux-gnueabi-readelf" --version-info "$F" 2>/dev/null | \
                grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tee -a "$LOG" || true
            fi
          done

          echo "LIBDRM_BUILD_RC=$VERIFY_RC" | tee -a "$LOG"
          echo "libdrm_rc=$VERIFY_RC" >> "$GITHUB_OUTPUT"
          echo "LIBDRM_BUILD_RC=$VERIFY_RC" >> "$GITHUB_ENV"
          exit 0

      - name: Validate combined NSS and libdrm target ABI
        id: combined_probe
        if: ${{ steps.libdrm.outputs.libdrm_rc == '0' }}
        shell: bash
        run: |
          set -uo pipefail
          . "$SDK_ENV"

          LOG="$GITHUB_WORKSPACE/lgwos-logs/combined-sysdeps-probe.log"
          BUILDROOT_OUT="$RUNNER_TEMP/buildroot-nss-out"
          BUILDROOT_TARGET_CC="$BUILDROOT_OUT/host/bin/arm-webos-linux-gnueabi-gcc"
          STAGING_DIR="$($BUILDROOT_TARGET_CC --print-sysroot 2>/dev/null || true)"

          export PKG_CONFIG_SYSROOT_DIR="$STAGING_DIR"
          export PKG_CONFIG_LIBDIR="$STAGING_DIR/usr/lib/pkgconfig:$STAGING_DIR/usr/share/pkgconfig"

          cat > "$RUNNER_TEMP/lgwos-combined-probe.c" <<'EOF'
          #include <nss.h>
          #include <xf86drm.h>
          int main(void) {
            drmVersionPtr version = drmGetVersion(-1);
            if (version) drmFreeVersion(version);
            return NSS_VersionCheck("3.0") ? 0 : 1;
          }
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/lgwos-combined-probe.c"

          CFLAGS="$(/usr/bin/pkg-config --cflags nss libdrm 2>/dev/null || true)"
          LIBS="$(/usr/bin/pkg-config --libs nss libdrm 2>/dev/null || true)"

          set +e
          "$BUILDROOT_TARGET_CC" $CFLAGS "$RUNNER_TEMP/lgwos-combined-probe.c" $LIBS \
            -o "$RUNNER_TEMP/lgwos-combined-probe" \
            2>&1 | tee "$LOG"
          RC=${PIPESTATUS[0]}
          set -e

          echo "COMBINED_LINK_RC=$RC" | tee -a "$LOG"
          file "$RUNNER_TEMP/lgwos-combined-probe" 2>/dev/null | tee -a "$LOG" || true
          "$BUILDROOT_OUT/host/bin/arm-webos-linux-gnueabi-readelf" -d "$RUNNER_TEMP/lgwos-combined-probe" 2>/dev/null | \
            grep NEEDED | tee -a "$LOG" || true

          echo "combined_probe_rc=$RC" >> "$GITHUB_OUTPUT"
          echo "COMBINED_LINK_RC=$RC" >> "$GITHUB_ENV"
          exit 0

      - name: Save upgraded sysdeps checkpoint
        if: ${{ steps.combined_probe.outputs.combined_probe_rc == '0' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/buildroot-nss-out
          key: lgwos-${{ env.SYSDEPS_CHECKPOINT_SCHEMA }}-${{ env.WEBOS_SDK_SHA256 }}-${{ env.BUILDROOT_REF }}

      - name: Dispatch Chromium incremental V2
        if: ${{ steps.combined_probe.outputs.combined_probe_rc == '0' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl -fL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/lgwos-chr120-incremental-v2.yml/dispatches" \
            -d '{"ref":"master"}'

      - name: Final repair summary
        if: always()
        shell: bash
        run: |
          {
            echo "NSS_CACHE_HIT=${{ steps.nss_cache.outputs.cache-hit }}"
            echo "HOST_AUDIT_RC=${HOST_AUDIT_RC:-NOT_RUN}"
            echo "HOST_NINJA_BUILD_RC=${HOST_NINJA_BUILD_RC:-NOT_RUN}"
            echo "LIBDRM_BUILD_RC=${LIBDRM_BUILD_RC:-NOT_RUN}"
            echo "COMBINED_LINK_RC=${COMBINED_LINK_RC:-NOT_RUN}"
            df -h /
            find "$GITHUB_WORKSPACE/lgwos-logs" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
          } | tee "$GITHUB_WORKSPACE/lgwos-logs/final-summary.log"

      - name: Upload repair logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lgwos-libdrm-checkpoint-fix-logs
          path: lgwos-logs/
          if-no-files-found: warn
          retention-days: 14
