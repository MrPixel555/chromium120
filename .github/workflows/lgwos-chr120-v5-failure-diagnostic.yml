name: LGWOS Chromium120 V5 Failure Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/lgwos-chr120-v5-failure-diagnostic.yml

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: "34846928423"
  SOURCE_ARTIFACT_ID: "10351142188"
  SOURCE_ARTIFACT_NAME: "lgwos-chr120-incremental-v5-logs"

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Download exact failed-run artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/lgwos-v5-diag"
          cd "$RUNNER_TEMP/lgwos-v5-diag"
          curl -fL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" \
            -o logs.zip
          unzip -q logs.zip -d logs
          echo "=== ARTIFACT CONTENTS ==="
          find logs -maxdepth 3 -type f -printf '%p %s bytes\n' | sort

      - name: Expose exact webOS runtime failure
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/lgwos-v5-diag/logs"
          LOG="$(find "$ROOT" -type f -name 'weboswebruntime-build.log' -print -quit)"
          test -n "$LOG"

          REPORT="$RUNNER_TEMP/lgwos-v5-diag/weboswebruntime-diagnostic.txt"
          {
            echo "LGWOS Chromium120 webOS runtime diagnostic"
            echo "SOURCE_RUN_ID=$SOURCE_RUN_ID"
            echo "SOURCE_ARTIFACT_ID=$SOURCE_ARTIFACT_ID"
            echo "SOURCE_ARTIFACT_NAME=$SOURCE_ARTIFACT_NAME"
            echo "LOG=$LOG"
            echo
            echo "=== FOCUSED FAILURE MATCHES WITH CONTEXT ==="
            grep -n -B 12 -A 40 -E 'FAILED:|fatal error:|(^|[^A-Za-z])error:|undefined reference|collect2:|ld: |cannot find|No such file|not found|ninja: build stopped|Killed|timed out|timeout' "$LOG" | tail -n 500 || true
            echo
            echo "=== LAST 350 LINES ==="
            tail -n 350 "$LOG"
          } | tee "$REPORT"

          {
            echo '## LGWOS Chromium120 V5 failure diagnostic'
            echo
            echo '```text'
            tail -n 220 "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lgwos-chr120-v5-failure-diagnostic
          path: ${{ runner.temp }}/lgwos-v5-diag/weboswebruntime-diagnostic.txt
          if-no-files-found: warn
          retention-days: 14
