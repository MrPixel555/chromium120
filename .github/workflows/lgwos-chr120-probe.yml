name: LGWOS Chromium120 Probe

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/lgwos-chr120-probe.yml

permissions:
  contents: read

concurrency:
  group: lgwos-chr120-probe
  cancel-in-progress: true

env:
  LGWOS_TARGET_SHA: e6a73fffdbe3bcc6f7fc33316c74adc6e7c01853
  WEBOS_SDK_URL: https://github.com/openlgtv/buildroot-nc4/releases/download/webos-a38c582/arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz
  WEBOS_SDK_SHA256: 04ad3311b48b4557a7002aef56ae2e167478e8e129f37daac04649bddf813616
  BUILDROOT_REF: a38c582ea397fec612811f8e933ae982d41fc5a3
  OUT_DIR: out/LGWOS-Probe

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Runner baseline and disk cleanup
        shell: bash
        run: |
          set -euxo pipefail
          echo '=== RUNNER BASELINE ==='
          uname -a
          lscpu | sed -n '1,40p'
          free -h
          df -h /

          echo '=== REMOVE LARGE UNUSED PREINSTALLED SDKs ==='
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          sudo apt-get clean || true

          echo '=== DISK AFTER CLEANUP ==='
          df -h /

      - name: Checkout exact Chromium 120 source commit
        uses: actions/checkout@v4
        with:
          ref: e6a73fffdbe3bcc6f7fc33316c74adc6e7c01853
          fetch-depth: 1
          submodules: false
          lfs: false
          clean: true

      - name: Verify source identity
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/lgwos-logs"
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "EXPECTED=${LGWOS_TARGET_SHA}"
            echo '--- chrome/VERSION ---'
            cat src/chrome/VERSION
            echo '--- repository size ---'
            du -sh . src .git || true
            echo '--- disk ---'
            df -h /
          } | tee "$GITHUB_WORKSPACE/lgwos-logs/source-identity.log"

          test "$(git rev-parse HEAD)" = "$LGWOS_TARGET_SHA"

      - name: Install host prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            binutils \
            bzip2 \
            ca-certificates \
            cpio \
            curl \
            file \
            gcc \
            g++ \
            gzip \
            make \
            ninja-build \
            patch \
            perl \
            pkg-config \
            python3 \
            python3-six \
            rsync \
            tar \
            unzip \
            wget \
            xz-utils
          df -h /

      - name: Download and relocate webOS Buildroot SDK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/lgwos-logs"
          SDK_ARCHIVE=/tmp/webos-sdk.tar.gz

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 20 \
            -o "$SDK_ARCHIVE" \
            "$WEBOS_SDK_URL"

          echo "$WEBOS_SDK_SHA256  $SDK_ARCHIVE" | sha256sum -c -

          sudo mkdir -p /opt/lgwos-sdk
          sudo tar -xzf "$SDK_ARCHIVE" -C /opt/lgwos-sdk
          rm -f "$SDK_ARCHIVE"
          sudo chown -R "$USER:$USER" /opt/lgwos-sdk

          SDK_ENV="$(find /opt/lgwos-sdk -type f -name environment-setup -print -quit)"
          test -n "$SDK_ENV"
          SDK_DIR="$(dirname "$SDK_ENV")"

          if [ -x "$SDK_DIR/relocate-sdk.sh" ]; then
            "$SDK_DIR/relocate-sdk.sh"
          fi

          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"
          echo "SDK_ENV=$SDK_ENV" >> "$GITHUB_ENV"

          {
            echo "SDK_DIR=$SDK_DIR"
            echo "SDK_ENV=$SDK_ENV"
            du -sh "$SDK_DIR"
            df -h /
          } | tee "$GITHUB_WORKSPACE/lgwos-logs/sdk-install.log"

      - name: Audit SDK ABI
        shell: bash
        run: |
          set -euxo pipefail
          . "$SDK_ENV"

          TARGET_SYSROOT="$(${CC%% *} --print-sysroot)"
          echo "TARGET_SYSROOT=$TARGET_SYSROOT" >> "$GITHUB_ENV"

          {
            echo "CC=$CC"
            echo "CXX=$CXX"
            echo "AR=$AR"
            echo "LD=$LD"
            echo "NM=$NM"
            echo "CC_PATH=$(command -v ${CC%% *})"
            echo "CXX_PATH=$(command -v ${CXX%% *})"
            ${CC%% *} --version
            ${CXX%% *} --version
            echo "SYSROOT=$TARGET_SYSROOT"
            echo '--- target macros ---'
            printf '' | ${CC%% *} -dM -E - | grep -E '__arm__|__ARM_ARCH|__SOFTFP__|__ARM_PCS|__GNUC__' | sort || true
            echo '--- existing dependency libraries ---'
            find "$TARGET_SYSROOT/usr/lib" -maxdepth 1 \( -name 'libsqlite3.so*' -o -name 'libz.so*' \) -print | sort || true
            echo '--- optional language frontends ---'
            command -v arm-webos-linux-gnueabi-gfortran || true
            command -v arm-webos-linux-gnueabi-gdc || true
            echo '--- disk ---'
            df -h /
          } | tee "$GITHUB_WORKSPACE/lgwos-logs/sdk-abi.log"

      - name: Audit SDK secure getenv ABI
        id: secure_env_abi
        shell: bash
        run: |
          set -uo pipefail
          . "$SDK_ENV"

          TARGET_SYSROOT="$(${CC%% *} --print-sysroot)"
          LIBC_SO="$(${CC%% *} -print-file-name=libc.so.6)"
          LOG="$GITHUB_WORKSPACE/lgwos-logs/sdk-secure-getenv-abi.log"

          {
            echo "TARGET_SYSROOT=$TARGET_SYSROOT"
            echo "LIBC_SO=$LIBC_SO"
            file "$LIBC_SO" || true
            echo '--- libc secure getenv dynamic symbols ---'
            ${READELF%% *} -Ws "$LIBC_SO" 2>/dev/null | grep -E '(__)?secure_getenv' || true
            echo '--- libc GLIBC symbol versions ---'
            ${READELF%% *} --version-info "$LIBC_SO" 2>/dev/null | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -40 || true
          } | tee "$LOG"

          cat > "$RUNNER_TEMP/lgwos-secure-getenv-public.c" <<'EOF'
          #define _GNU_SOURCE 1
          #include <stdlib.h>
          int main(void) {
            return secure_getenv("LGWOS") ? 0 : 0;
          }
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/lgwos-secure-getenv-public.c"

          set +e
          ${CC%% *} \
            -std=c99 \
            -Werror=implicit-function-declaration \
            "$RUNNER_TEMP/lgwos-secure-getenv-public.c" \
            -o "$RUNNER_TEMP/lgwos-secure-getenv-public" \
            >> "$LOG" 2>&1
          PUBLIC_RC=$?
          set -e

          cat > "$RUNNER_TEMP/lgwos-secure-getenv-legacy.c" <<'EOF'
          extern char *__secure_getenv(const char *);
          int main(void) {
            return __secure_getenv("LGWOS") ? 0 : 0;
          }
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/lgwos-secure-getenv-legacy.c"

          set +e
          ${CC%% *} \
            -std=c99 \
            -Werror=implicit-function-declaration \
            "$RUNNER_TEMP/lgwos-secure-getenv-legacy.c" \
            -o "$RUNNER_TEMP/lgwos-secure-getenv-legacy" \
            >> "$LOG" 2>&1
          LEGACY_RC=$?
          set -e

          {
            echo "SECURE_GETENV_PUBLIC_RC=$PUBLIC_RC"
            echo "SECURE_GETENV_LEGACY_RC=$LEGACY_RC"
          } | tee -a "$LOG"

          if [ "$PUBLIC_RC" -eq 0 ]; then
            MODE="secure_getenv"
          elif [ "$LEGACY_RC" -eq 0 ]; then
            MODE="__secure_getenv"
          else
            MODE="unavailable"
          fi

          echo "LGWOS_SECURE_GETENV_MODE=$MODE" | tee -a "$LOG"
          echo "LGWOS_SECURE_GETENV_MODE=$MODE" >> "$GITHUB_ENV"
          echo "secure_getenv_mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Audit target pkg-config metadata before augmentation
        shell: bash
        run: |
          set -uo pipefail
          . "$SDK_ENV"

          TARGET_SYSROOT="$(${CC%% *} --print-sysroot)"
          TARGET_PKG_CONFIG_LIBDIR="$TARGET_SYSROOT/usr/lib/pkgconfig:$TARGET_SYSROOT/usr/share/pkgconfig"

          {
            echo "TARGET_SYSROOT=$TARGET_SYSROOT"
            echo "TARGET_PKG_CONFIG=/usr/bin/pkg-config"
            echo "TARGET_PKG_CONFIG_LIBDIR=$TARGET_PKG_CONFIG_LIBDIR"
            echo '--- pkg-config files of interest ---'
            find "$TARGET_SYSROOT" -type f \( \
              -name 'nss.pc' -o \
              -name 'nspr.pc' -o \
              -name 'sqlite3.pc' -o \
              -name 'zlib.pc' -o \
              -name 'openssl.pc' -o \
              -name 'wayland-client.pc' -o \
              -name 'wayland-webos-client.pc' \
            \) -print | sort || true

            echo '--- target pkg-config probes ---'
            export PKG_CONFIG_SYSROOT_DIR="$TARGET_SYSROOT"
            export PKG_CONFIG_LIBDIR="$TARGET_PKG_CONFIG_LIBDIR"

            for P in nss nspr sqlite3 zlib openssl wayland-client wayland-webos-client; do
              printf '%s=' "$P"
              /usr/bin/pkg-config --modversion "$P" 2>/dev/null || echo NOT_FOUND
            done
          } | tee "$GITHUB_WORKSPACE/lgwos-logs/target-pkg-config-before.log"

      - name: Build and inject ABI-compatible NSPR and NSS
        id: nss_augment
        shell: bash
        run: |
          set -uo pipefail
          . "$SDK_ENV"

          mkdir -p "$GITHUB_WORKSPACE/lgwos-logs"
          BUILDROOT_SRC="$RUNNER_TEMP/buildroot-nc4"
          BUILDROOT_OUT="$RUNNER_TEMP/buildroot-nss-out"
          BUILDROOT_TARBALL="$RUNNER_TEMP/buildroot-nc4.tar.gz"
          TARGET_SYSROOT="$(${CC%% *} --print-sysroot)"
          LOG="$GITHUB_WORKSPACE/lgwos-logs/nss-build.log"

          rm -rf "$BUILDROOT_SRC" "$BUILDROOT_OUT" "$BUILDROOT_TARBALL"
          mkdir -p "$BUILDROOT_SRC" "$BUILDROOT_OUT"

          echo '=== FETCH EXACT BUILDROOT SOURCE ===' | tee "$LOG"
          echo "BUILDROOT_REF=$BUILDROOT_REF" | tee -a "$LOG"
          echo "LGWOS_SECURE_GETENV_MODE=${LGWOS_SECURE_GETENV_MODE:-UNSET}" | tee -a "$LOG"

          if [ "${LGWOS_SECURE_GETENV_MODE:-unavailable}" = "unavailable" ]; then
            echo 'NSS_COMPAT_ERROR=no secure getenv ABI available' | tee -a "$LOG"
            echo 'NSS_AUGMENT_RC=90' >> "$GITHUB_ENV"
            echo 'nss_augment_rc=90' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 20 \
            -o "$BUILDROOT_TARBALL" \
            "https://codeload.github.com/openlgtv/buildroot-nc4/tar.gz/$BUILDROOT_REF" \
            2>&1 | tee -a "$LOG"
          FETCH_RC=${PIPESTATUS[0]}
          set -e

          if [ "$FETCH_RC" -ne 0 ]; then
            echo "BUILDROOT_FETCH_RC=$FETCH_RC" | tee -a "$LOG"
            echo "NSS_AUGMENT_RC=$FETCH_RC" >> "$GITHUB_ENV"
            echo "nss_augment_rc=$FETCH_RC" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tar -xzf "$BUILDROOT_TARBALL" --strip-components=1 -C "$BUILDROOT_SRC"
          rm -f "$BUILDROOT_TARBALL"

          echo '=== RESTORE UPSTREAM BUILDROOT KERNEL-HEADER VALIDATION ===' | tee -a "$LOG"
          python3 - "$BUILDROOT_SRC/toolchain/helpers.mk" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          lines = path.read_text().splitlines(True)
          out = []
          restoring = False
          restored = False

          for line in lines:
              if line.startswith("#check_kernel_headers_version ="):
                  restoring = True
                  restored = True
              if restoring and line.startswith("#"):
                  line = line[1:]
              out.append(line)
              if restoring and line.lstrip().startswith("fi"):
                  restoring = False

          if not restored:
              raise SystemExit("expected commented check_kernel_headers_version block not found")

          path.write_text("".join(out))
          PY

          if [ "$LGWOS_SECURE_GETENV_MODE" = "__secure_getenv" ]; then
            echo '=== INSTALL LGWOS LEGACY-GLIBC NSS COMPAT HOOK ===' | tee -a "$LOG"
            cat >> "$BUILDROOT_SRC/package/libnss/libnss.mk" <<'EOF'

          # LGWOS compatibility: this SDK targets a pre-glibc-2.17 userspace.
          # NSS 3.108 uses public secure_getenv(), while NSPR detects and uses
          # the ABI-compatible legacy __secure_getenv() symbol on this target.
          define LIBNSS_LGWOS_LEGACY_SECURE_GETENV
          	$(SED) '/#include <stdlib.h>/a extern char *__secure_getenv(const char *);' $(@D)/nss/lib/freebl/stubs.c
          	$(SED) 's/return secure_getenv(var);/return __secure_getenv(var);/' $(@D)/nss/lib/freebl/stubs.c
          endef
          LIBNSS_PRE_CONFIGURE_HOOKS += LIBNSS_LGWOS_LEGACY_SECURE_GETENV
          EOF
            sed -i 's/^          //' "$BUILDROOT_SRC/package/libnss/libnss.mk"
          fi

          {
            echo '--- restored helper ---'
            grep -A6 '^check_kernel_headers_version = ' "$BUILDROOT_SRC/toolchain/helpers.mk"
            echo '--- versions ---'
            echo "BUILDROOT_SOURCE_REF=$BUILDROOT_REF"
            echo "SDK_DIR=$SDK_DIR"
            echo "TARGET_SYSROOT=$TARGET_SYSROOT"
            grep -E '^LIBNSPR_VERSION|^LIBNSS_VERSION' \
              "$BUILDROOT_SRC/package/libnspr/libnspr.mk" \
              "$BUILDROOT_SRC/package/libnss/libnss.mk"
            echo '--- LGWOS NSS compatibility hook ---'
            grep -A8 '^define LIBNSS_LGWOS_LEGACY_SECURE_GETENV' \
              "$BUILDROOT_SRC/package/libnss/libnss.mk" || true
          } | tee -a "$LOG"

          cat > "$BUILDROOT_SRC/configs/lgwos_nss_defconfig" <<EOF
          BR2_arm=y
          BR2_cortex_a9=y
          BR2_ARM_ENABLE_NEON=y
          BR2_ARM_ENABLE_VFP=y
          BR2_ARM_ENABLE_FP16=y
          BR2_ARM_FPU_NEON_FP16=y
          BR2_ARM_EABI=y
          BR2_ARM_INSTRUCTIONS_ARM=y
          BR2_TOOLCHAIN_EXTERNAL=y
          BR2_TOOLCHAIN_EXTERNAL_CUSTOM=y
          BR2_TOOLCHAIN_EXTERNAL_PREINSTALLED=y
          BR2_TOOLCHAIN_EXTERNAL_PATH="$SDK_DIR"
          BR2_TOOLCHAIN_EXTERNAL_CUSTOM_PREFIX="arm-webos-linux-gnueabi"
          BR2_TOOLCHAIN_EXTERNAL_GCC_14=y
          BR2_TOOLCHAIN_EXTERNAL_HEADERS_3_10=y
          BR2_TOOLCHAIN_EXTERNAL_CUSTOM_GLIBC=y
          BR2_TOOLCHAIN_EXTERNAL_LOCALE=y
          BR2_TOOLCHAIN_EXTERNAL_HAS_THREADS=y
          BR2_TOOLCHAIN_EXTERNAL_HAS_THREADS_DEBUG=y
          BR2_TOOLCHAIN_EXTERNAL_HAS_THREADS_NPTL=y
          BR2_TOOLCHAIN_EXTERNAL_HAS_SSP=y
          BR2_TOOLCHAIN_EXTERNAL_HAS_SSP_STRONG=y
          BR2_TOOLCHAIN_EXTERNAL_CXX=y
          BR2_SHARED_LIBS=y
          BR2_PACKAGE_LIBNSS=y
          # BR2_TARGET_ROOTFS_TAR is not set
          EOF
          sed -i 's/^          //' "$BUILDROOT_SRC/configs/lgwos_nss_defconfig"

          echo '=== CONFIGURE BUILDROOT WITH EXISTING WEBOS SDK AS EXTERNAL TOOLCHAIN ===' | tee -a "$LOG"
          set +e
          make -C "$BUILDROOT_SRC" O="$BUILDROOT_OUT" lgwos_nss_defconfig \
            2>&1 | tee -a "$LOG"
          CONFIG_RC=${PIPESTATUS[0]}
          set -e

          echo "BUILDROOT_CONFIG_RC=$CONFIG_RC" | tee -a "$LOG"
          if [ "$CONFIG_RC" -ne 0 ]; then
            echo "NSS_AUGMENT_RC=$CONFIG_RC" >> "$GITHUB_ENV"
            echo "nss_augment_rc=$CONFIG_RC" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo '=== EFFECTIVE BUILDROOT NSS CONFIG ==='
            grep -E '^BR2_(arm|cortex_a9|ARM_|TOOLCHAIN_EXTERNAL|USE_WCHAR|ENABLE_LOCALE|TOOLCHAIN_HAS_THREADS|TOOLCHAIN_HAS_SSP|INSTALL_LIBSTDCPP|PACKAGE_LIBNSPR|PACKAGE_LIBNSS|PACKAGE_SQLITE|PACKAGE_ZLIB)' \
              "$BUILDROOT_OUT/.config" | sort || true
          } | tee "$GITHUB_WORKSPACE/lgwos-logs/nss-build-config.log"

          echo '=== BUILD LIBNSS TARGET AND DEPENDENCIES ===' | tee -a "$LOG"
          set +e
          make -C "$BUILDROOT_SRC" O="$BUILDROOT_OUT" -j4 libnss \
            2>&1 | tee -a "$LOG"
          BUILD_RC=${PIPESTATUS[0]}
          set -e

          echo "BUILDROOT_LIBNSS_RC=$BUILD_RC" | tee -a "$LOG"
          if [ "$BUILD_RC" -ne 0 ]; then
            echo "NSS_AUGMENT_RC=$BUILD_RC" >> "$GITHUB_ENV"
            echo "nss_augment_rc=$BUILD_RC" >> "$GITHUB_OUTPUT"
            df -h / | tee -a "$LOG"
            exit 0
          fi

          BUILDROOT_TARGET_CC="$BUILDROOT_OUT/host/bin/arm-webos-linux-gnueabi-gcc"

          if [ ! -x "$BUILDROOT_TARGET_CC" ]; then
            echo "BUILDROOT_TARGET_CC_MISSING=$BUILDROOT_TARGET_CC" | tee -a "$LOG"
            echo 'NSS_AUGMENT_RC=91' >> "$GITHUB_ENV"
            echo 'nss_augment_rc=91' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STAGING_DIR="$($BUILDROOT_TARGET_CC --print-sysroot 2>/dev/null || true)"

          echo "BUILDROOT_TARGET_CC=$BUILDROOT_TARGET_CC" | tee -a "$LOG"
          echo "NSS_BUILD_STAGING=$STAGING_DIR" | tee -a "$LOG"
          ls -ld "$BUILDROOT_OUT/staging" "$STAGING_DIR" 2>/dev/null | tee -a "$LOG" || true

          if [ -z "$STAGING_DIR" ] || [ ! -d "$STAGING_DIR/usr/lib" ]; then
            echo "BUILDROOT_STAGING_INVALID=$STAGING_DIR" | tee -a "$LOG"
            echo 'NSS_AUGMENT_RC=92' >> "$GITHUB_ENV"
            echo 'nss_augment_rc=92' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERIFY_RC=0
          for F in \
            "$STAGING_DIR/usr/lib/pkgconfig/nspr.pc" \
            "$STAGING_DIR/usr/lib/pkgconfig/nss.pc" \
            "$STAGING_DIR/usr/lib/libnspr4.so" \
            "$STAGING_DIR/usr/lib/libnss3.so" \
            "$STAGING_DIR/usr/lib/libssl3.so"
          do
            if [ -e "$F" ]; then
              echo "BUILT_OK=$F" | tee -a "$LOG"
            else
              echo "BUILT_MISSING=$F" | tee -a "$LOG"
              VERIFY_RC=1
            fi
          done

          echo '=== NSS/NSPR GLIBC VERSION AUDIT ===' | tee -a "$LOG"
          for F in "$STAGING_DIR/usr/lib"/libnspr4.so "$STAGING_DIR/usr/lib"/libnss*.so "$STAGING_DIR/usr/lib"/libssl3.so "$STAGING_DIR/usr/lib"/libsmime3.so "$STAGING_DIR/usr/lib"/libfreebl*.so; do
            if [ -e "$F" ]; then
              echo "--- $(basename "$F") ---" | tee -a "$LOG"
              ${READELF%% *} -Ws "$F" 2>/dev/null | grep -E '(__)?secure_getenv' | tee -a "$LOG" || true
              ${READELF%% *} --version-info "$F" 2>/dev/null | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tee -a "$LOG" || true
              if ${READELF%% *} --version-info "$F" 2>/dev/null | grep -q 'GLIBC_2\.17'; then
                echo "FORBIDDEN_GLIBC_2_17=$(basename "$F")" | tee -a "$LOG"
                VERIFY_RC=1
              fi
            fi
          done

          if [ "$VERIFY_RC" -ne 0 ]; then
            echo "NSS_AUGMENT_RC=$VERIFY_RC" >> "$GITHUB_ENV"
            echo "nss_augment_rc=$VERIFY_RC" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo '=== INJECT ONLY NSPR/NSS ARTIFACTS INTO CHROMIUM SDK SYSROOT ===' | tee -a "$LOG"
          install -d \
            "$TARGET_SYSROOT/usr/include/nspr" \
            "$TARGET_SYSROOT/usr/include/nss" \
            "$TARGET_SYSROOT/usr/lib/pkgconfig"

          rsync -a "$STAGING_DIR/usr/include/nspr/" "$TARGET_SYSROOT/usr/include/nspr/"
          rsync -a "$STAGING_DIR/usr/include/nss/" "$TARGET_SYSROOT/usr/include/nss/"
          cp -a "$STAGING_DIR/usr/lib/pkgconfig/nspr.pc" "$TARGET_SYSROOT/usr/lib/pkgconfig/"
          cp -a "$STAGING_DIR/usr/lib/pkgconfig/nss.pc" "$TARGET_SYSROOT/usr/lib/pkgconfig/"

          for GLOB in \
            'libnspr4.so*' \
            'libplc4.so*' \
            'libplds4.so*' \
            'libnss*.so*' \
            'libsmime3.so*' \
            'libssl3.so*' \
            'libsoftokn3.so*' \
            'libfreebl*.so*'
          do
            for F in "$STAGING_DIR/usr/lib"/$GLOB; do
              if [ -e "$F" ]; then
                cp -a "$F" "$TARGET_SYSROOT/usr/lib/"
                echo "INJECTED=$(basename "$F")" | tee -a "$LOG"
              fi
            done
          done

          echo '=== POST-INJECTION PKG-CONFIG AND LINK PROBE ===' | tee -a "$LOG"
          export PKG_CONFIG_SYSROOT_DIR="$TARGET_SYSROOT"
          export PKG_CONFIG_LIBDIR="$TARGET_SYSROOT/usr/lib/pkgconfig:$TARGET_SYSROOT/usr/share/pkgconfig"

          NSS_VERSION="$(/usr/bin/pkg-config --modversion nss 2>/dev/null || true)"
          NSPR_VERSION="$(/usr/bin/pkg-config --modversion nspr 2>/dev/null || true)"
          echo "NSS_VERSION=$NSS_VERSION" | tee -a "$LOG"
          echo "NSPR_VERSION=$NSPR_VERSION" | tee -a "$LOG"

          if [ -z "$NSS_VERSION" ] || [ -z "$NSPR_VERSION" ]; then
            VERIFY_RC=1
          fi

          cat > "$RUNNER_TEMP/lgwos-nss-probe.c" <<'EOF'
          #include <nss.h>
          int main(void) {
            return NSS_VersionCheck("3.0") ? 0 : 1;
          }
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/lgwos-nss-probe.c"

          NSS_CFLAGS="$(/usr/bin/pkg-config --cflags nss 2>/dev/null || true)"
          NSS_LIBS="$(/usr/bin/pkg-config --libs nss 2>/dev/null || true)"
          echo "NSS_CFLAGS=$NSS_CFLAGS" | tee -a "$LOG"
          echo "NSS_LIBS=$NSS_LIBS" | tee -a "$LOG"

          set +e
          ${CC%% *} $NSS_CFLAGS "$RUNNER_TEMP/lgwos-nss-probe.c" $NSS_LIBS \
            -o "$RUNNER_TEMP/lgwos-nss-probe" \
            2>&1 | tee -a "$LOG"
          LINK_RC=${PIPESTATUS[0]}
          set -e

          echo "NSS_LINK_PROBE_RC=$LINK_RC" | tee -a "$LOG"
          if [ "$LINK_RC" -ne 0 ]; then
            VERIFY_RC=1
          else
            file "$RUNNER_TEMP/lgwos-nss-probe" | tee -a "$LOG"
            ${READELF%% *} -h "$RUNNER_TEMP/lgwos-nss-probe" | tee -a "$LOG"
            ${READELF%% *} -d "$RUNNER_TEMP/lgwos-nss-probe" | grep NEEDED | tee -a "$LOG" || true
            ${READELF%% *} -A "$TARGET_SYSROOT/usr/lib/libnss3.so" | tee "$GITHUB_WORKSPACE/lgwos-logs/nss-arm-attributes.log"
          fi

          echo "NSS_AUGMENT_RC=$VERIFY_RC" | tee -a "$LOG"
          echo "NSS_AUGMENT_RC=$VERIFY_RC" >> "$GITHUB_ENV"
          echo "nss_augment_rc=$VERIFY_RC" >> "$GITHUB_OUTPUT"
          df -h / | tee -a "$LOG"
          exit 0

      - name: Audit target pkg-config metadata after augmentation
        if: ${{ steps.nss_augment.conclusion == 'success' && steps.nss_augment.outputs.nss_augment_rc == '0' }}
        shell: bash
        run: |
          set -uo pipefail
          . "$SDK_ENV"
          TARGET_SYSROOT="$(${CC%% *} --print-sysroot)"
          export PKG_CONFIG_SYSROOT_DIR="$TARGET_SYSROOT"
          export PKG_CONFIG_LIBDIR="$TARGET_SYSROOT/usr/lib/pkgconfig:$TARGET_SYSROOT/usr/share/pkgconfig"

          {
            for P in nss nspr sqlite3 zlib openssl wayland-client wayland-webos-client; do
              printf '%s=' "$P"
              /usr/bin/pkg-config --modversion "$P" 2>/dev/null || echo NOT_FOUND
            done
            echo '--- NSS/NSPR files ---'
            find "$TARGET_SYSROOT/usr/lib" -maxdepth 1 \( \
              -name 'libnspr4.so*' -o \
              -name 'libplc4.so*' -o \
              -name 'libplds4.so*' -o \
              -name 'libnss*.so*' -o \
              -name 'libsmime3.so*' -o \
              -name 'libssl3.so*' -o \
              -name 'libsoftokn3.so*' -o \
              -name 'libfreebl*.so*' \
            \) -print | sort
          } | tee "$GITHUB_WORKSPACE/lgwos-logs/target-pkg-config-after.log"

      - name: Audit Chromium build tools
        shell: bash
        run: |
          set -euxo pipefail
          {
            file src/buildtools/linux64/gn
            src/buildtools/linux64/gn --version
            command -v ninja
            ninja --version
            python3 --version
            echo '--- critical trees ---'
            for d in base build buildtools chrome components content gpu media net neva third_party ui v8 webos; do
              if [ -d "src/$d" ]; then
                echo "DIR_OK=$d"
              else
                echo "DIR_MISSING=$d"
              fi
            done
            echo '--- disk ---'
            df -h /
          } | tee "$GITHUB_WORKSPACE/lgwos-logs/build-tools.log"

      - name: Generate LGWOS GN build graph
        id: gn_gen
        if: ${{ steps.nss_augment.conclusion == 'success' && steps.nss_augment.outputs.nss_augment_rc == '0' }}
        shell: bash
        run: |
          set -uo pipefail
          . "$SDK_ENV"

          mkdir -p "$GITHUB_WORKSPACE/lgwos-logs"
          cd "$GITHUB_WORKSPACE/src"

          TARGET_CC="$(command -v ${CC%% *})"
          TARGET_CXX="$(command -v ${CXX%% *})"
          TARGET_AR="$(command -v ${AR%% *})"
          TARGET_LD="$(command -v ${LD%% *})"
          TARGET_NM="$(command -v ${NM%% *})"
          TARGET_SYSROOT="$(${CC%% *} --print-sysroot)"

          HOST_CC="$(command -v gcc)"
          HOST_CXX="$(command -v g++)"
          HOST_AR="$(command -v ar)"
          HOST_NM="$(command -v nm)"

          ARGS_FILE="$GITHUB_WORKSPACE/lgwos-logs/args.gn"

          cat > "$ARGS_FILE" <<EOF
          is_webos=true
          is_cross_linux_build=true
          is_clang=false
          is_debug=false
          is_component_build=false
          target_os="linux"
          target_cpu="arm"
          arm_arch="armv7-a"
          arm_version=7
          arm_float_abi="softfp"
          use_sysroot=false
          target_sysroot="$TARGET_SYSROOT"
          system_libdir="lib"
          pkg_config="/usr/bin/pkg-config"
          use_custom_libcxx=false
          host_toolchain="//build/toolchain/cros:host"
          cros_host_ar="$HOST_AR"
          cros_host_cc="$HOST_CC"
          cros_host_cxx="$HOST_CXX"
          cros_host_ld="$HOST_CXX"
          cros_host_nm="$HOST_NM"
          cros_host_sysroot="/"
          cros_target_ar="$TARGET_AR"
          cros_target_cc="$TARGET_CC"
          cros_target_cxx="$TARGET_CXX"
          cros_target_ld="$TARGET_LD"
          cros_target_nm="$TARGET_NM"
          webos_toolprefix="arm-webos-linux-gnueabi-"
          enable_nacl=false
          enable_print_preview=false
          enable_remoting=false
          use_cups=false
          use_kerberos=false
          use_gnome_keyring=false
          use_dbus=false
          use_ozone=true
          ozone_auto_platforms=false
          fatal_linker_warnings=false
          use_debug_fission=false
          proprietary_codecs=true
          ffmpeg_branding="Chrome"
          EOF

          sed -i 's/^          //' "$ARGS_FILE"

          echo '=== GN ARGS ===' | tee "$GITHUB_WORKSPACE/lgwos-logs/gn-gen.log"
          cat "$ARGS_FILE" | tee -a "$GITHUB_WORKSPACE/lgwos-logs/gn-gen.log"
          echo '=== GN GEN ===' | tee -a "$GITHUB_WORKSPACE/lgwos-logs/gn-gen.log"

          set +e
          ./buildtools/linux64/gn gen "$OUT_DIR" \
            --args="$(cat "$ARGS_FILE")" \
            2>&1 | tee -a "$GITHUB_WORKSPACE/lgwos-logs/gn-gen.log"
          GN_RC=${PIPESTATUS[0]}
          set -e

          echo "GN_RC=$GN_RC" | tee -a "$GITHUB_WORKSPACE/lgwos-logs/gn-gen.log"
          echo "GN_RC=$GN_RC" >> "$GITHUB_ENV"
          echo "gn_rc=$GN_RC" >> "$GITHUB_OUTPUT"
          df -h / | tee -a "$GITHUB_WORKSPACE/lgwos-logs/gn-gen.log"

          exit 0

      - name: Inspect generated target graph
        if: ${{ steps.gn_gen.conclusion == 'success' && steps.gn_gen.outputs.gn_rc == '0' }}
        shell: bash
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE/src"
          {
            echo '=== CHROME TARGET ==='
            ./buildtools/linux64/gn desc "$OUT_DIR" //chrome:chrome || true
            echo '=== WEBOS WEBRUNTIME TARGET ==='
            ./buildtools/linux64/gn desc "$OUT_DIR" //webos:weboswebruntime || true
          } > "$GITHUB_WORKSPACE/lgwos-logs/gn-targets.log" 2>&1
          tail -200 "$GITHUB_WORKSPACE/lgwos-logs/gn-targets.log"

      - name: Compile base smoke target
        if: ${{ steps.gn_gen.conclusion == 'success' && steps.gn_gen.outputs.gn_rc == '0' }}
        shell: bash
        run: |
          set -uo pipefail
          . "$SDK_ENV"
          cd "$GITHUB_WORKSPACE/src"

          set +e
          timeout 30m ninja -C "$OUT_DIR" -j2 base \
            2>&1 | tee "$GITHUB_WORKSPACE/lgwos-logs/base-build.log"
          BASE_RC=${PIPESTATUS[0]}
          set -e

          echo "BASE_BUILD_RC=$BASE_RC" | tee -a "$GITHUB_WORKSPACE/lgwos-logs/base-build.log"
          echo "BASE_BUILD_RC=$BASE_RC" >> "$GITHUB_ENV"
          df -h / | tee -a "$GITHUB_WORKSPACE/lgwos-logs/base-build.log"
          exit 0

      - name: Final probe summary
        if: always()
        shell: bash
        run: |
          {
            echo "HEAD=$(git rev-parse HEAD 2>/dev/null || true)"
            echo "LGWOS_SECURE_GETENV_MODE=${LGWOS_SECURE_GETENV_MODE:-NOT_RUN}"
            echo "NSS_AUGMENT_RC=${NSS_AUGMENT_RC:-NOT_RUN}"
            echo "GN_RC=${GN_RC:-NOT_RUN}"
            echo "BASE_BUILD_RC=${BASE_BUILD_RC:-NOT_RUN}"
            echo '--- disk ---'
            df -h /
            echo '--- log files ---'
            find "$GITHUB_WORKSPACE/lgwos-logs" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
          } | tee "$GITHUB_WORKSPACE/lgwos-logs/final-summary.log"

      - name: Upload LGWOS probe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lgwos-chr120-probe-logs
          path: lgwos-logs/
          if-no-files-found: warn
          retention-days: 14
