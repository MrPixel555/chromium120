name: LGWOS Chromium120 Probe

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/lgwos-chr120-probe.yml

permissions:
  contents: read

concurrency:
  group: lgwos-chr120-probe
  cancel-in-progress: true

env:
  LGWOS_TARGET_SHA: e6a73fffdbe3bcc6f7fc33316c74adc6e7c01853
  WEBOS_SDK_URL: https://github.com/openlgtv/buildroot-nc4/releases/download/webos-a38c582/arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz
  WEBOS_SDK_SHA256: 04ad3311b48b4557a7002aef56ae2e167478e8e129f37daac04649bddf813616
  OUT_DIR: out/LGWOS-Probe

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Runner baseline and disk cleanup
        shell: bash
        run: |
          set -euxo pipefail
          echo '=== RUNNER BASELINE ==='
          uname -a
          lscpu | sed -n '1,40p'
          free -h
          df -h /

          echo '=== REMOVE LARGE UNUSED PREINSTALLED SDKs ==='
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          sudo apt-get clean || true

          echo '=== DISK AFTER CLEANUP ==='
          df -h /

      - name: Checkout exact Chromium 120 source commit
        uses: actions/checkout@v4
        with:
          ref: e6a73fffdbe3bcc6f7fc33316c74adc6e7c01853
          fetch-depth: 1
          submodules: false
          lfs: false
          clean: true

      - name: Verify source identity
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/lgwos-logs"
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "EXPECTED=${LGWOS_TARGET_SHA}"
            echo '--- chrome/VERSION ---'
            cat src/chrome/VERSION
            echo '--- repository size ---'
            du -sh . src .git || true
            echo '--- disk ---'
            df -h /
          } | tee "$GITHUB_WORKSPACE/lgwos-logs/source-identity.log"

          test "$(git rev-parse HEAD)" = "$LGWOS_TARGET_SHA"

      - name: Install host prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            file \
            gcc \
            g++ \
            binutils \
            ninja-build \
            pkg-config \
            python3 \
            python3-six \
            xz-utils
          df -h /

      - name: Download and relocate webOS Buildroot SDK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/lgwos-logs"
          SDK_ARCHIVE=/tmp/webos-sdk.tar.gz

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 20 \
            -o "$SDK_ARCHIVE" \
            "$WEBOS_SDK_URL"

          echo "$WEBOS_SDK_SHA256  $SDK_ARCHIVE" | sha256sum -c -

          sudo mkdir -p /opt/lgwos-sdk
          sudo tar -xzf "$SDK_ARCHIVE" -C /opt/lgwos-sdk
          rm -f "$SDK_ARCHIVE"
          sudo chown -R "$USER:$USER" /opt/lgwos-sdk

          SDK_ENV="$(find /opt/lgwos-sdk -type f -name environment-setup -print -quit)"
          test -n "$SDK_ENV"
          SDK_DIR="$(dirname "$SDK_ENV")"

          if [ -x "$SDK_DIR/relocate-sdk.sh" ]; then
            "$SDK_DIR/relocate-sdk.sh"
          fi

          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"
          echo "SDK_ENV=$SDK_ENV" >> "$GITHUB_ENV"

          {
            echo "SDK_DIR=$SDK_DIR"
            echo "SDK_ENV=$SDK_ENV"
            du -sh "$SDK_DIR"
            df -h /
          } | tee "$GITHUB_WORKSPACE/lgwos-logs/sdk-install.log"

      - name: Audit SDK ABI
        shell: bash
        run: |
          set -euxo pipefail
          . "$SDK_ENV"

          TARGET_SYSROOT="$(${CC%% *} --print-sysroot)"
          echo "TARGET_SYSROOT=$TARGET_SYSROOT" >> "$GITHUB_ENV"

          {
            echo "CC=$CC"
            echo "CXX=$CXX"
            echo "AR=$AR"
            echo "LD=$LD"
            echo "NM=$NM"
            echo "CC_PATH=$(command -v ${CC%% *})"
            echo "CXX_PATH=$(command -v ${CXX%% *})"
            ${CC%% *} --version
            ${CXX%% *} --version
            echo "SYSROOT=$TARGET_SYSROOT"
            echo '--- target macros ---'
            printf '' | ${CC%% *} -dM -E - | grep -E '__arm__|__ARM_ARCH|__SOFTFP__|__ARM_PCS|__GNUC__' | sort || true
            echo '--- disk ---'
            df -h /
          } | tee "$GITHUB_WORKSPACE/lgwos-logs/sdk-abi.log"

      - name: Audit target pkg-config metadata
        shell: bash
        run: |
          set -uo pipefail
          . "$SDK_ENV"

          TARGET_SYSROOT="$(${CC%% *} --print-sysroot)"
          TARGET_PKG_CONFIG_LIBDIR="$TARGET_SYSROOT/usr/lib/pkgconfig:$TARGET_SYSROOT/usr/share/pkgconfig"

          {
            echo "TARGET_SYSROOT=$TARGET_SYSROOT"
            echo "TARGET_PKG_CONFIG=/usr/bin/pkg-config"
            echo "TARGET_PKG_CONFIG_LIBDIR=$TARGET_PKG_CONFIG_LIBDIR"
            echo '--- pkg-config files of interest ---'
            find "$TARGET_SYSROOT" -type f \( \
              -name 'nss.pc' -o \
              -name 'nspr.pc' -o \
              -name 'openssl.pc' -o \
              -name 'wayland-client.pc' -o \
              -name 'wayland-webos-client.pc' \
            \) -print | sort || true

            echo '--- target pkg-config probes ---'
            export PKG_CONFIG_SYSROOT_DIR="$TARGET_SYSROOT"
            export PKG_CONFIG_LIBDIR="$TARGET_PKG_CONFIG_LIBDIR"

            for P in nss nspr openssl wayland-client wayland-webos-client; do
              printf '%s=' "$P"
              /usr/bin/pkg-config --modversion "$P" 2>/dev/null || echo NOT_FOUND
            done

            echo '--- pkg-config search directories present ---'
            for D in "$TARGET_SYSROOT/usr/lib/pkgconfig" "$TARGET_SYSROOT/usr/share/pkgconfig"; do
              if [ -d "$D" ]; then
                echo "DIR_OK=$D"
                find "$D" -maxdepth 1 -type f -name '*.pc' | wc -l
              else
                echo "DIR_MISSING=$D"
              fi
            done
          } | tee "$GITHUB_WORKSPACE/lgwos-logs/target-pkg-config.log"

      - name: Audit Chromium build tools
        shell: bash
        run: |
          set -euxo pipefail
          {
            file src/buildtools/linux64/gn
            src/buildtools/linux64/gn --version
            command -v ninja
            ninja --version
            python3 --version
            echo '--- critical trees ---'
            for d in base build buildtools chrome components content gpu media net neva third_party ui v8 webos; do
              if [ -d "src/$d" ]; then
                echo "DIR_OK=$d"
              else
                echo "DIR_MISSING=$d"
              fi
            done
            echo '--- disk ---'
            df -h /
          } | tee "$GITHUB_WORKSPACE/lgwos-logs/build-tools.log"

      - name: Generate LGWOS GN build graph
        id: gn_gen
        shell: bash
        run: |
          set -uo pipefail
          . "$SDK_ENV"

          mkdir -p "$GITHUB_WORKSPACE/lgwos-logs"
          cd "$GITHUB_WORKSPACE/src"

          TARGET_CC="$(command -v ${CC%% *})"
          TARGET_CXX="$(command -v ${CXX%% *})"
          TARGET_AR="$(command -v ${AR%% *})"
          TARGET_LD="$(command -v ${LD%% *})"
          TARGET_NM="$(command -v ${NM%% *})"
          TARGET_SYSROOT="$(${CC%% *} --print-sysroot)"

          HOST_CC="$(command -v gcc)"
          HOST_CXX="$(command -v g++)"
          HOST_AR="$(command -v ar)"
          HOST_NM="$(command -v nm)"

          ARGS_FILE="$GITHUB_WORKSPACE/lgwos-logs/args.gn"

          cat > "$ARGS_FILE" <<EOF
          is_webos=true
          is_cross_linux_build=true
          is_clang=false
          is_debug=false
          is_component_build=false
          target_os="linux"
          target_cpu="arm"
          arm_arch="armv7-a"
          arm_version=7
          arm_float_abi="softfp"
          use_sysroot=false
          target_sysroot="$TARGET_SYSROOT"
          system_libdir="lib"
          pkg_config="/usr/bin/pkg-config"
          use_custom_libcxx=false
          host_toolchain="//build/toolchain/cros:host"
          cros_host_ar="$HOST_AR"
          cros_host_cc="$HOST_CC"
          cros_host_cxx="$HOST_CXX"
          cros_host_ld="$HOST_CXX"
          cros_host_nm="$HOST_NM"
          cros_host_sysroot="/"
          cros_target_ar="$TARGET_AR"
          cros_target_cc="$TARGET_CC"
          cros_target_cxx="$TARGET_CXX"
          cros_target_ld="$TARGET_LD"
          cros_target_nm="$TARGET_NM"
          webos_toolprefix="arm-webos-linux-gnueabi-"
          enable_nacl=false
          enable_print_preview=false
          enable_remoting=false
          use_cups=false
          use_kerberos=false
          use_gnome_keyring=false
          use_ozone=true
          ozone_auto_platforms=false
          fatal_linker_warnings=false
          use_debug_fission=false
          proprietary_codecs=true
          ffmpeg_branding="Chrome"
          EOF

          sed -i 's/^          //' "$ARGS_FILE"

          echo '=== GN ARGS ===' | tee "$GITHUB_WORKSPACE/lgwos-logs/gn-gen.log"
          cat "$ARGS_FILE" | tee -a "$GITHUB_WORKSPACE/lgwos-logs/gn-gen.log"
          echo '=== GN GEN ===' | tee -a "$GITHUB_WORKSPACE/lgwos-logs/gn-gen.log"

          set +e
          ./buildtools/linux64/gn gen "$OUT_DIR" \
            --args="$(cat "$ARGS_FILE")" \
            2>&1 | tee -a "$GITHUB_WORKSPACE/lgwos-logs/gn-gen.log"
          GN_RC=${PIPESTATUS[0]}
          set -e

          echo "GN_RC=$GN_RC" | tee -a "$GITHUB_WORKSPACE/lgwos-logs/gn-gen.log"
          echo "GN_RC=$GN_RC" >> "$GITHUB_ENV"
          echo "gn_rc=$GN_RC" >> "$GITHUB_OUTPUT"
          df -h / | tee -a "$GITHUB_WORKSPACE/lgwos-logs/gn-gen.log"

          exit 0

      - name: Inspect generated target graph
        if: env.GN_RC == '0'
        shell: bash
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE/src"
          {
            echo '=== CHROME TARGET ==='
            ./buildtools/linux64/gn desc "$OUT_DIR" //chrome:chrome || true
            echo '=== WEBOS WEBRUNTIME TARGET ==='
            ./buildtools/linux64/gn desc "$OUT_DIR" //webos:weboswebruntime || true
          } > "$GITHUB_WORKSPACE/lgwos-logs/gn-targets.log" 2>&1
          tail -200 "$GITHUB_WORKSPACE/lgwos-logs/gn-targets.log"

      - name: Compile base smoke target
        if: env.GN_RC == '0'
        shell: bash
        run: |
          set -uo pipefail
          . "$SDK_ENV"
          cd "$GITHUB_WORKSPACE/src"

          set +e
          timeout 30m ninja -C "$OUT_DIR" -j2 base \
            2>&1 | tee "$GITHUB_WORKSPACE/lgwos-logs/base-build.log"
          BASE_RC=${PIPESTATUS[0]}
          set -e

          echo "BASE_BUILD_RC=$BASE_RC" | tee -a "$GITHUB_WORKSPACE/lgwos-logs/base-build.log"
          echo "BASE_BUILD_RC=$BASE_RC" >> "$GITHUB_ENV"
          df -h / | tee -a "$GITHUB_WORKSPACE/lgwos-logs/base-build.log"
          exit 0

      - name: Final probe summary
        if: always()
        shell: bash
        run: |
          {
            echo "HEAD=$(git rev-parse HEAD 2>/dev/null || true)"
            echo "GN_RC=${GN_RC:-NOT_RUN}"
            echo "BASE_BUILD_RC=${BASE_BUILD_RC:-NOT_RUN}"
            echo '--- disk ---'
            df -h /
            echo '--- log files ---'
            find "$GITHUB_WORKSPACE/lgwos-logs" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
          } | tee "$GITHUB_WORKSPACE/lgwos-logs/final-summary.log"

      - name: Upload LGWOS probe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lgwos-chr120-probe-logs
          path: lgwos-logs/
          if-no-files-found: warn
          retention-days: 14
