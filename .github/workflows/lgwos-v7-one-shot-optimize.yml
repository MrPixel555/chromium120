name: LGWOS V7 One-Shot Optimizer

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/lgwos-v7-one-shot-optimize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-v7:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout workflow branch
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Patch V7 workflow
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/lgwos-chr120-incremental-v7.yml')
          lines = p.read_text().splitlines()
          out = []
          inserted_args = False
          inserted_mtime = False
          tuned_build = False
          in_build = False

          for line in lines:
              if line == '    timeout-minutes: 180':
                  line = '    timeout-minutes: 330'

              if line == '      - name: Patch source compatibility gates, Neva locale dependency, legacy ARM APIs, and skcms FP16 gate':
                  if inserted_mtime:
                      raise SystemExit('mtime step duplicate')
                  out.extend([
                      '      - name: Normalize source mtimes for real incremental reuse',
                      '        shell: bash',
                      '        run: |',
                      '          set -euxo pipefail',
                      '          cd "$GITHUB_WORKSPACE/src"',
                      '          COMMIT_EPOCH="$(git show -s --format=%ct "$LGWOS_TARGET_SHA")"',
                      '          git ls-files -z . | xargs -0 -r touch -d "@$COMMIT_EPOCH"',
                      '          {',
                      '            echo "LGWOS_TARGET_SHA=$LGWOS_TARGET_SHA"',
                      '            echo "COMMIT_EPOCH=$COMMIT_EPOCH"',
                      '            echo "NORMALIZED_UTC=$(date -u -d "@$COMMIT_EPOCH" +%Y-%m-%dT%H:%M:%SZ)"',
                      '          } | tee "$GITHUB_WORKSPACE/lgwos-logs/mtime-normalization.log"',
                      '',
                  ])
                  inserted_mtime = True

              if line == '          use_ozone=true':
                  out.append(line)
                  out.append('          use_libpci=false')
                  out.append('          use_udev=false')
                  inserted_args = True
                  continue

              if line == '      - name: Build webOS web runtime':
                  in_build = True

              if in_build and line == '          cd "$GITHUB_WORKSPACE/src"':
                  out.append(line)
                  out.extend([
                      '',
                      '          CPU_JOBS="$(nproc)"',
                      '          MEM_KB="$(awk \'/MemTotal:/ {print $2}\' /proc/meminfo)"',
                      '          MEM_JOBS=$(( MEM_KB / 1800000 ))',
                      '          if [ "$MEM_JOBS" -lt 2 ]; then MEM_JOBS=2; fi',
                      '          JOBS="$CPU_JOBS"',
                      '          if [ "$JOBS" -gt "$MEM_JOBS" ]; then JOBS="$MEM_JOBS"; fi',
                      '          if [ "$JOBS" -gt 6 ]; then JOBS=6; fi',
                      '          if [ "$JOBS" -lt 2 ]; then JOBS=2; fi',
                      '          export NINJA_STATUS=\'[%f/%t %p | active=%r | elapsed=%es | rate=%o/s] \'',
                      '          {',
                      '            echo "CPU_JOBS=$CPU_JOBS"',
                      '            echo "MEM_KB=$MEM_KB"',
                      '            echo "MEM_JOBS=$MEM_JOBS"',
                      '            echo "NINJA_JOBS=$JOBS"',
                      '            free -h',
                      '          } | tee "$GITHUB_WORKSPACE/lgwos-logs/runner-capacity.log"',
                      '',
                      '          set +e',
                      '          ninja -C "$OUT_DIR" -n -d explain webos:weboswebruntime > "$GITHUB_WORKSPACE/lgwos-logs/ninja-dry-run-explain.log" 2>&1',
                      '          DRY_RC=$?',
                      '          set -e',
                      '          {',
                      '            echo "NINJA_DRY_RUN_RC=$DRY_RC"',
                      '            echo "DIRTY_REASON_COUNT=$(grep -c \'^ninja explain:\' "$GITHUB_WORKSPACE/lgwos-logs/ninja-dry-run-explain.log" || true)"',
                      '            grep \'^ninja explain:\' "$GITHUB_WORKSPACE/lgwos-logs/ninja-dry-run-explain.log" | head -n 120 || true',
                      '            tail -n 40 "$GITHUB_WORKSPACE/lgwos-logs/ninja-dry-run-explain.log" || true',
                      '          } | tee "$GITHUB_WORKSPACE/lgwos-logs/incremental-audit.log"',
                  ])
                  tuned_build = True
                  continue

              if in_build and line == '          timeout 90m ninja -C "$OUT_DIR" -j2 webos:weboswebruntime \\':
                  line = '          timeout 300m ninja -C "$OUT_DIR" -j"$JOBS" webos:weboswebruntime \\'

              out.append(line)

          if not inserted_args:
              raise SystemExit('use_ozone anchor not found')
          if not inserted_mtime:
              raise SystemExit('patch-step anchor not found')
          if not tuned_build:
              raise SystemExit('build-step anchor not found')
          text = '\n'.join(out) + '\n'
          if 'timeout 90m ninja' in text or '-j2 webos:weboswebruntime' in text:
              raise SystemExit('old ninja invocation still present')
          p.write_text(text)
          PY

          git diff --check
          git diff -- .github/workflows/lgwos-chr120-incremental-v7.yml

      - name: Commit optimized V7
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/lgwos-chr120-incremental-v7.yml
          git diff --cached --quiet && exit 0
          git commit -m "ci: fix libpci blocker and make V7 truly incremental"
          git push origin HEAD:master
