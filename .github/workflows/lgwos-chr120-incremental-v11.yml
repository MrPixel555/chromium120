name: LGWOS Chromium120 Incremental V11

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/lgwos-chr120-incremental-v11.yml

permissions:
  contents: read

env:
  LGWOS_TARGET_SHA: e6a73fffdbe3bcc6f7fc33316c74adc6e7c01853
  WEBOS_SDK_URL: https://github.com/openlgtv/buildroot-nc4/releases/download/webos-a38c582/arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz
  WEBOS_SDK_SHA256: 04ad3311b48b4557a7002aef56ae2e167478e8e129f37daac04649bddf813616
  BUILDROOT_REF: a38c582ea397fec612811f8e933ae982d41fc5a3
  OUT_DIR: out/LGWOS-Probe
  SYSDEPS_CHECKPOINT_SCHEMA: sysdeps-v2
  CHROMIUM_CHECKPOINT_SCHEMA: chromium-out-v3

jobs:
  incremental:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - name: Runner cleanup
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          sudo apt-get clean || true
          df -h /

      - name: Checkout exact Chromium 120 source
        uses: actions/checkout@v4
        with:
          ref: e6a73fffdbe3bcc6f7fc33316c74adc6e7c01853
          fetch-depth: 1
          submodules: false
          lfs: false
          clean: true

      - name: Install host prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/lgwos-logs"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc binutils bzip2 ca-certificates cpio curl file gcc g++ g++-multilib gzip libglib2.0-dev libnspr4-dev libnss3-dev make ninja-build patch perl pkg-config python3 python3-six rsync tar unzip wget xz-utils
          cat > "$RUNNER_TEMP/lgwos-x86-multilib-smoke.cc" <<'EOF'
          #include <atomic>
          int main() {
            std::atomic<int> value{0};
            return value.load();
          }
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/lgwos-x86-multilib-smoke.cc"
          CLANGXX="$GITHUB_WORKSPACE/src/third_party/llvm-build/Release+Asserts/bin/clang++"
          test -x "$CLANGXX"
          "$CLANGXX" -m32 -std=c++20 "$RUNNER_TEMP/lgwos-x86-multilib-smoke.cc" -o "$RUNNER_TEMP/lgwos-x86-multilib-smoke" 2>&1 | tee "$GITHUB_WORKSPACE/lgwos-logs/x86-multilib-smoke.log"
          file "$RUNNER_TEMP/lgwos-x86-multilib-smoke" | tee -a "$GITHUB_WORKSPACE/lgwos-logs/x86-multilib-smoke.log"
          file "$RUNNER_TEMP/lgwos-x86-multilib-smoke" | grep -q 'ELF 32-bit'
          "$RUNNER_TEMP/lgwos-x86-multilib-smoke"
          echo X86_MULTILIB_SMOKE_RC=0 | tee -a "$GITHUB_WORKSPACE/lgwos-logs/x86-multilib-smoke.log"

      - name: Create Debian multiarch pkg-config bridge
        shell: bash
        run: |
          set -euxo pipefail
          HOST_MULTIARCH="$(gcc -print-multiarch)"
          HOST_PC_DIR="/usr/lib/$HOST_MULTIARCH/pkgconfig"
          test -d "$HOST_PC_DIR"
          sudo mkdir -p /usr/lib/pkgconfig
          for PC in "$HOST_PC_DIR"/*.pc; do
            [ ! -f "$PC" ] || sudo ln -sfn "$PC" "/usr/lib/pkgconfig/$(basename "$PC")"
          done
          for P in glib-2.0 gmodule-2.0 gobject-2.0 gthread-2.0 nspr nss; do /usr/bin/pkg-config --modversion "$P"; done

      - name: Download and relocate webOS SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ARCHIVE="$RUNNER_TEMP/webos-sdk.tar.gz"
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 20 -o "$SDK_ARCHIVE" "$WEBOS_SDK_URL"
          echo "$WEBOS_SDK_SHA256  $SDK_ARCHIVE" | sha256sum -c -
          sudo rm -rf /opt/lgwos-sdk
          sudo mkdir -p /opt/lgwos-sdk
          sudo tar -xzf "$SDK_ARCHIVE" -C /opt/lgwos-sdk
          rm -f "$SDK_ARCHIVE"
          sudo chown -R "$USER:$USER" /opt/lgwos-sdk
          SDK_ENV="$(find /opt/lgwos-sdk -type f -name environment-setup -print -quit)"
          test -n "$SDK_ENV"
          SDK_DIR="$(dirname "$SDK_ENV")"
          [ ! -x "$SDK_DIR/relocate-sdk.sh" ] || "$SDK_DIR/relocate-sdk.sh"
          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"
          echo "SDK_ENV=$SDK_ENV" >> "$GITHUB_ENV"
          . "$SDK_ENV"
          TARGET_SYSROOT="$(${CC%% *} --print-sysroot)"
          echo "TARGET_SYSROOT=$TARGET_SYSROOT" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$LGWOS_TARGET_SHA"

      - name: Restore validated sysdeps v2
        id: sysdeps_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/buildroot-nss-out
          key: lgwos-${{ env.SYSDEPS_CHECKPOINT_SCHEMA }}-${{ env.WEBOS_SDK_SHA256 }}-${{ env.BUILDROOT_REF }}
          fail-on-cache-miss: true

      - name: Revalidate and inject target sysdeps
        shell: bash
        run: |
          set -euxo pipefail
          . "$SDK_ENV"
          BUILDROOT_OUT="$RUNNER_TEMP/buildroot-nss-out"
          BUILDROOT_CC="$BUILDROOT_OUT/host/bin/arm-webos-linux-gnueabi-gcc"
          BUILDROOT_READELF="$BUILDROOT_OUT/host/bin/arm-webos-linux-gnueabi-readelf"
          STAGING_DIR="$($BUILDROOT_CC --print-sysroot)"
          TARGET_SYSROOT="$(${CC%% *} --print-sysroot)"
          REAL_LIBDRM="$(find "$STAGING_DIR/usr/lib" -maxdepth 1 -type f -name 'libdrm.so.*' -print | sort | head -1)"
          test -n "$REAL_LIBDRM"
          ! "$BUILDROOT_READELF" -d "$REAL_LIBDRM" | grep -q libudev
          install -d "$TARGET_SYSROOT/usr/include/nspr" "$TARGET_SYSROOT/usr/include/nss" "$TARGET_SYSROOT/usr/include/libdrm" "$TARGET_SYSROOT/usr/lib/pkgconfig"
          rsync -a "$STAGING_DIR/usr/include/nspr/" "$TARGET_SYSROOT/usr/include/nspr/"
          rsync -a "$STAGING_DIR/usr/include/nss/" "$TARGET_SYSROOT/usr/include/nss/"
          rsync -a "$STAGING_DIR/usr/include/libdrm/" "$TARGET_SYSROOT/usr/include/libdrm/"
          cp -a "$STAGING_DIR/usr/include/xf86drm.h" "$STAGING_DIR/usr/include/xf86drmMode.h" "$TARGET_SYSROOT/usr/include/"
          for PC in nspr.pc nss.pc libdrm.pc; do cp -a "$STAGING_DIR/usr/lib/pkgconfig/$PC" "$TARGET_SYSROOT/usr/lib/pkgconfig/"; done
          for GLOB in 'libnspr4.so*' 'libplc4.so*' 'libplds4.so*' 'libnss*.so*' 'libsmime3.so*' 'libssl3.so*' 'libsoftokn3.so*' 'libfreebl*.so*' 'libdrm.so*'; do
            for F in "$STAGING_DIR/usr/lib"/$GLOB; do [ ! -e "$F" ] || cp -a "$F" "$TARGET_SYSROOT/usr/lib/"; done
          done
          export PKG_CONFIG_SYSROOT_DIR="$TARGET_SYSROOT"
          export PKG_CONFIG_LIBDIR="$TARGET_SYSROOT/usr/lib/pkgconfig:$TARGET_SYSROOT/usr/share/pkgconfig"
          test "$(/usr/bin/pkg-config --modversion nss)" = 3.108
          test "$(/usr/bin/pkg-config --modversion nspr)" = 4.36.0
          test "$(/usr/bin/pkg-config --modversion libdrm)" = 2.4.124

      - name: Apply validated LGWOS compatibility patchset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          PATCH="$RUNNER_TEMP/lgwos-source-gates.patch"
          curl -fL --retry 3 --retry-delay 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/.github/patches/lgwos-chr120-source-gates.patch?ref=master" -o "$PATCH"
          cd "$GITHUB_WORKSPACE"
          git apply --check "$PATCH"
          git apply "$PATCH"
          git diff --check
          cp "$PATCH" "$GITHUB_WORKSPACE/lgwos-logs/source-gates.patch"

      - name: Apply ARMv7 compatibility patchset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          PATCH="$RUNNER_TEMP/lgwos-armv7-v11.patch"
          curl -fL --retry 3 --retry-delay 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/.github/patches/lgwos-chr120-lzma-armv7-v9.patch?ref=master" -o "$PATCH"
          cd "$GITHUB_WORKSPACE"
          git apply --check "$PATCH"
          git apply "$PATCH"
          git diff --check
          grep -n -A 22 -B 4 '#elif defined(MY_CPU_ARM)' src/third_party/lzma_sdk/C/CpuArch.c | tee "$GITHUB_WORKSPACE/lgwos-logs/lzma-armv7-patch-audit.log"
          grep -n -A 12 -B 4 'SYS_memfd_create' src/third_party/crashpad/crashpad/compat/linux/sys/mman_memfd_create.cc | tee "$GITHUB_WORKSPACE/lgwos-logs/crashpad-memfd-patch-audit.log"
          grep -n -A 12 -B 4 'O_TMPFILE' src/third_party/crashpad/crashpad/util/file/file_io_posix.cc | tee "$GITHUB_WORKSPACE/lgwos-logs/crashpad-otmpfile-patch-audit.log"
          cp "$PATCH" "$GITHUB_WORKSPACE/lgwos-logs/armv7-v11.patch"

      - name: Normalize patched source mtimes for incremental reuse
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          COMMIT_EPOCH="$(git show -s --format=%ct "$LGWOS_TARGET_SHA")"
          find src -xdev \( -type f -o -type l \) -print0 | xargs -0 -r touch -h -d "@$COMMIT_EPOCH"
          {
            echo "PHASE=after-all-source-patches"
            echo "LGWOS_TARGET_SHA=$LGWOS_TARGET_SHA"
            echo "COMMIT_EPOCH=$COMMIT_EPOCH"
            echo "NORMALIZED_UTC=$(date -u -d "@$COMMIT_EPOCH" +%Y-%m-%dT%H:%M:%SZ)"
            stat -c 'MTIME=%y FILE=%n' src/third_party/zlib/cpu_features.c src/third_party/skia/modules/skcms/src/Transform_inl.h src/third_party/lzma_sdk/C/CpuArch.c src/third_party/crashpad/crashpad/compat/linux/sys/mman_memfd_create.cc src/third_party/crashpad/crashpad/util/file/file_io_posix.cc
          } | tee "$GITHUB_WORKSPACE/lgwos-logs/mtime-normalization.log"

      - name: Restore Chromium incremental checkpoint
        id: chromium_cache
        uses: actions/cache/restore@v4
        with:
          path: src/out/LGWOS-Probe
          key: lgwos-${{ env.CHROMIUM_CHECKPOINT_SCHEMA }}-${{ env.LGWOS_TARGET_SHA }}-${{ env.WEBOS_SDK_SHA256 }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lgwos-${{ env.CHROMIUM_CHECKPOINT_SCHEMA }}-${{ env.LGWOS_TARGET_SHA }}-${{ env.WEBOS_SDK_SHA256 }}-${{ github.run_id }}-
            lgwos-${{ env.CHROMIUM_CHECKPOINT_SCHEMA }}-${{ env.LGWOS_TARGET_SHA }}-${{ env.WEBOS_SDK_SHA256 }}-
          fail-on-cache-miss: false

      - name: Verify restored Chromium checkpoint
        id: checkpoint_probe
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$GITHUB_WORKSPACE/src/$OUT_DIR"
          RESTORED=false
          if [ -f "$OUT/build.ninja" ]; then RESTORED=true; fi
          OBJECT_COUNT=0
          CHECKPOINT_BYTES=0
          if [ -d "$OUT" ]; then
            OBJECT_COUNT="$(find "$OUT" -type f -name '*.o' | wc -l)"
            CHECKPOINT_BYTES="$(du -sb "$OUT" | awk '{print $1}')"
          fi
          {
            echo "CACHE_EXACT_HIT=${{ steps.chromium_cache.outputs.cache-hit }}"
            echo "CACHE_PRIMARY_KEY=${{ steps.chromium_cache.outputs.cache-primary-key }}"
            echo "CACHE_MATCHED_KEY=${{ steps.chromium_cache.outputs.cache-matched-key }}"
            echo "CHROMIUM_CHECKPOINT_RESTORED=$RESTORED"
            echo "OBJECT_COUNT=$OBJECT_COUNT"
            echo "CHECKPOINT_BYTES=$CHECKPOINT_BYTES"
          } | tee "$GITHUB_WORKSPACE/lgwos-logs/checkpoint-restore.log"
          echo "restored=$RESTORED" >> "$GITHUB_OUTPUT"

      - name: Generate GN graph
        shell: bash
        run: |
          set -euxo pipefail
          . "$SDK_ENV"
          cd "$GITHUB_WORKSPACE/src"
          TARGET_CC="$(command -v ${CC%% *})"; TARGET_CXX="$(command -v ${CXX%% *})"; TARGET_AR="$(command -v ${AR%% *})"; TARGET_LD="$(command -v ${LD%% *})"; TARGET_NM="$(command -v ${NM%% *})"
          TARGET_SYSROOT="$(${CC%% *} --print-sysroot)"
          HOST_CC="$(command -v gcc)"; HOST_CXX="$(command -v g++)"; HOST_AR="$(command -v ar)"; HOST_NM="$(command -v nm)"
          ARGS_FILE="$GITHUB_WORKSPACE/lgwos-logs/args.gn"
          cat > "$ARGS_FILE" <<EOF
          is_webos=true
          is_cross_linux_build=true
          is_clang=false
          is_debug=false
          is_component_build=false
          target_os="linux"
          target_cpu="arm"
          arm_arch="armv7-a"
          arm_version=7
          arm_float_abi="softfp"
          use_sysroot=false
          target_sysroot="$TARGET_SYSROOT"
          system_libdir="lib"
          pkg_config="/usr/bin/pkg-config"
          use_custom_libcxx=false
          host_toolchain="//build/toolchain/cros:host"
          cros_host_ar="$HOST_AR"
          cros_host_cc="$HOST_CC"
          cros_host_cxx="$HOST_CXX"
          cros_host_ld="$HOST_CXX"
          cros_host_nm="$HOST_NM"
          cros_host_sysroot="/"
          cros_target_ar="$TARGET_AR"
          cros_target_cc="$TARGET_CC"
          cros_target_cxx="$TARGET_CXX"
          cros_target_ld="$TARGET_LD"
          cros_target_nm="$TARGET_NM"
          webos_toolprefix="arm-webos-linux-gnueabi-"
          enable_nacl=false
          enable_print_preview=false
          enable_remoting=false
          use_cups=false
          use_kerberos=false
          use_gnome_keyring=false
          use_dbus=false
          use_pangocairo=false
          use_vaapi=false
          use_v4l2_codec=false
          disable_zlib_arm_aes_cflag=true
          use_ozone=true
          use_libpci=false
          ozone_auto_platforms=false
          fatal_linker_warnings=false
          treat_warnings_as_errors=false
          use_debug_fission=false
          proprietary_codecs=true
          ffmpeg_branding="Chrome"
          EOF
          sed -i 's/^          //' "$ARGS_FILE"
          ./buildtools/linux64/gn gen "$OUT_DIR" --args="$(cat "$ARGS_FILE")" 2>&1 | tee "$GITHUB_WORKSPACE/lgwos-logs/gn-gen.log"
          echo GN_RC=0 >> "$GITHUB_WORKSPACE/lgwos-logs/gn-gen.log"

      - name: Smoke-test patched LZMA CpuArch object
        shell: bash
        run: |
          set -o pipefail
          . "$SDK_ENV"
          cd "$GITHUB_WORKSPACE/src"
          export NINJA_STATUS='[%f/%t %p | active=%r | elapsed=%es | rate=%o/s] '
          set +e
          ninja -C "$OUT_DIR" -j1 obj/third_party/lzma_sdk/lzma_sdk/CpuArch.o 2>&1 | tee "$GITHUB_WORKSPACE/lgwos-logs/lzma-cpuarch-smoke.log"
          RC=${PIPESTATUS[0]}
          set -e
          echo "LZMA_CPUARCH_SMOKE_RC=$RC" | tee -a "$GITHUB_WORKSPACE/lgwos-logs/lzma-cpuarch-smoke.log"
          exit "$RC"

      - name: Smoke-test patched Crashpad memfd object
        shell: bash
        run: |
          set -o pipefail
          . "$SDK_ENV"
          cd "$GITHUB_WORKSPACE/src"
          export NINJA_STATUS='[%f/%t %p | active=%r | elapsed=%es | rate=%o/s] '
          set +e
          ninja -C "$OUT_DIR" -j1 obj/third_party/crashpad/crashpad/compat/compat/mman_memfd_create.o 2>&1 | tee "$GITHUB_WORKSPACE/lgwos-logs/crashpad-memfd-smoke.log"
          RC=${PIPESTATUS[0]}
          set -e
          echo "CRASHPAD_MEMFD_SMOKE_RC=$RC" | tee -a "$GITHUB_WORKSPACE/lgwos-logs/crashpad-memfd-smoke.log"
          exit "$RC"

      - name: Smoke-test patched Crashpad file_io_posix object
        shell: bash
        run: |
          set -o pipefail
          . "$SDK_ENV"
          cd "$GITHUB_WORKSPACE/src"
          export NINJA_STATUS='[%f/%t %p | active=%r | elapsed=%es | rate=%o/s] '
          set +e
          ninja -C "$OUT_DIR" -j1 obj/third_party/crashpad/crashpad/util/util/file_io_posix.o 2>&1 | tee "$GITHUB_WORKSPACE/lgwos-logs/crashpad-file-io-posix-smoke.log"
          RC=${PIPESTATUS[0]}
          set -e
          echo "CRASHPAD_FILE_IO_POSIX_SMOKE_RC=$RC" | tee -a "$GITHUB_WORKSPACE/lgwos-logs/crashpad-file-io-posix-smoke.log"
          exit "$RC"

      - name: Build webOS web runtime
        shell: bash
        run: |
          set -o pipefail
          . "$SDK_ENV"
          cd "$GITHUB_WORKSPACE/src"
          CPU_JOBS="$(nproc)"
          MEM_KB="$(awk '/MemTotal:/ {print $2}' /proc/meminfo)"
          MEM_JOBS=$(( MEM_KB / 1800000 ))
          [ "$MEM_JOBS" -ge 2 ] || MEM_JOBS=2
          JOBS="$CPU_JOBS"
          [ "$JOBS" -le "$MEM_JOBS" ] || JOBS="$MEM_JOBS"
          [ "$JOBS" -le 6 ] || JOBS=6
          [ "$JOBS" -ge 2 ] || JOBS=2
          export NINJA_STATUS='[%f/%t %p | active=%r | elapsed=%es | rate=%o/s] '
          { echo "CPU_JOBS=$CPU_JOBS"; echo "MEM_KB=$MEM_KB"; echo "MEM_JOBS=$MEM_JOBS"; echo "NINJA_JOBS=$JOBS"; lscpu; free -h; } | tee "$GITHUB_WORKSPACE/lgwos-logs/runner-capacity.log"
          set +e
          ninja -C "$OUT_DIR" -n -d explain webos:weboswebruntime > "$GITHUB_WORKSPACE/lgwos-logs/ninja-dry-run-explain.log" 2>&1
          DRY_RC=$?
          set -e
          { echo "NINJA_DRY_RUN_RC=$DRY_RC"; echo "DIRTY_REASON_COUNT=$(grep -c '^ninja explain:' "$GITHUB_WORKSPACE/lgwos-logs/ninja-dry-run-explain.log" || true)"; grep '^ninja explain:' "$GITHUB_WORKSPACE/lgwos-logs/ninja-dry-run-explain.log" | head -n 120 || true; tail -n 40 "$GITHUB_WORKSPACE/lgwos-logs/ninja-dry-run-explain.log" || true; } | tee "$GITHUB_WORKSPACE/lgwos-logs/incremental-audit.log"
          set +e
          timeout 300m ninja -C "$OUT_DIR" -j"$JOBS" webos:weboswebruntime 2>&1 | tee "$GITHUB_WORKSPACE/lgwos-logs/weboswebruntime-build.log"
          RC=${PIPESTATUS[0]}
          set -e
          echo "WEBOSWEBRUNTIME_BUILD_RC=$RC" | tee -a "$GITHUB_WORKSPACE/lgwos-logs/weboswebruntime-build.log"
          if [ "$RC" -ne 0 ]; then
            grep -n -B 12 -A 40 -E 'FAILED:|fatal error:|(^|[^A-Za-z])error:|undefined reference|collect2:|ld: |cannot find|No such file|not found|ninja: build stopped|Killed|timed out|timeout|target specific option mismatch' "$GITHUB_WORKSPACE/lgwos-logs/weboswebruntime-build.log" | tail -n 700 || true
            tail -n 300 "$GITHUB_WORKSPACE/lgwos-logs/weboswebruntime-build.log" || true
          fi
          exit "$RC"

      - name: Save Chromium incremental checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: src/out/LGWOS-Probe
          key: lgwos-${{ env.CHROMIUM_CHECKPOINT_SCHEMA }}-${{ env.LGWOS_TARGET_SHA }}-${{ env.WEBOS_SDK_SHA256 }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Final summary
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/lgwos-logs"
          {
            echo "HEAD=$(git rev-parse HEAD 2>/dev/null || true)"
            echo "RUN_ATTEMPT=${{ github.run_attempt }}"
            echo "SYSDEPS_CACHE_HIT=${{ steps.sysdeps_cache.outputs.cache-hit }}"
            echo "CHROMIUM_CACHE_EXACT_HIT=${{ steps.chromium_cache.outputs.cache-hit }}"
            echo "CHROMIUM_CHECKPOINT_RESTORED=${{ steps.checkpoint_probe.outputs.restored }}"
            grep -h '^GN_RC=' "$GITHUB_WORKSPACE/lgwos-logs/gn-gen.log" 2>/dev/null || true
            grep -h '^LZMA_CPUARCH_SMOKE_RC=' "$GITHUB_WORKSPACE/lgwos-logs/lzma-cpuarch-smoke.log" 2>/dev/null || true
            grep -h '^CRASHPAD_MEMFD_SMOKE_RC=' "$GITHUB_WORKSPACE/lgwos-logs/crashpad-memfd-smoke.log" 2>/dev/null || true
            grep -h '^CRASHPAD_FILE_IO_POSIX_SMOKE_RC=' "$GITHUB_WORKSPACE/lgwos-logs/crashpad-file-io-posix-smoke.log" 2>/dev/null || true
            grep -h '^WEBOSWEBRUNTIME_BUILD_RC=' "$GITHUB_WORKSPACE/lgwos-logs/weboswebruntime-build.log" 2>/dev/null || true
            df -h /
          } | tee "$GITHUB_WORKSPACE/lgwos-logs/final-summary.log"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lgwos-chr120-incremental-v11-logs
          path: lgwos-logs
          if-no-files-found: warn
          retention-days: 14
